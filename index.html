            skipped += 1;
            return;
          }
          if (/^(课程名称|课程名|科目)[：:]/.test(name)) name = name.replace(/^(课程名称|课程名|科目)[：:]/, "").trim();
          if (!name) {
            skipped += 1;
            return;
          }

          const rawDay = pick(mappingsByName.day);
          const rawStart = pick(mappingsByName.start);
          const rawEnd = pick(mappingsByName.end);
          const combined = [rawDay, rawStart, rawEnd].join(" ");
          let day = parseWeekday(rawDay, true);
          if (day === null) day = parseWeekdayFromText(combined);
          if (day === null) {
            skipped += 1;
            return;
          }

          let timeInfo = parseTimeExpression(rawStart) || parseTimeExpression(combined);
          if (!timeInfo) timeInfo = parseSlotInfo(rawStart) || parseSlotInfo(combined);
          let start = timeInfo ? timeInfo.start : null;
          let end = timeInfo ? timeInfo.end : null;
          if (!end && mappingsByName.end >= 0) end = parseSingleClock(pick(mappingsByName.end));
          if (!start) {
            skipped += 1;
            return;
          }
          if (!end) end = addMinutes(start, 45);
          if (timeToMinutes(end) <= timeToMinutes(start)) {
            skipped += 1;
            return;
          }

          const cleanCourse = parseCourseNameAndMeta(name);
          const finalName = cleanCourse.name || name;
          const place = stripWeekNotes(pick(mappingsByName.place)) || cleanCourse.place;
          const teacher = stripWeekNotes(pick(mappingsByName.teacher)) || cleanCourse.teacher;
          parsedCourses.push({
            name: finalName,
            day,
            start,
            end,
            place: place || "",
            teacher: teacher || "",
            color: colorFromText(finalName)
          });
        });
        return { courses: parsedCourses, skipped };
      }

      function detectMatrixGrid(grid) {
        const searchEnd = Math.min(grid.length, 15);
        for (let headerIndex = 0; headerIndex < searchEnd; headerIndex += 1) {
          const row = grid[headerIndex];
          if (!row) continue;
          const dayColumns = [];
          row.forEach((cell, columnIndex) => {
            if (columnIndex > 0 && parseWeekday(cell) !== null) dayColumns.push(columnIndex);
          });
          if (dayColumns.length < 4 || headerIndex + 1 >= grid.length) continue;
          let timeColumn = -1;
          row.forEach((cell, columnIndex) => {
            if (dayColumns.includes(columnIndex)) return;
            if (/时间|节次/.test(cellText(cell))) timeColumn = columnIndex;
          });
          const hasData = grid.slice(headerIndex + 1).some((dataRow) => {
            return dayColumns.some((columnIndex) => splitCellEntries(dataRow[columnIndex]).length);
          });
          if (!hasData) continue;
          return { headerIndex, dayColumns, timeColumn };
        }
        return null;
      }

      function parseMatrixGrid(grid, matrixInfo) {
        const headerRow = grid[matrixInfo.headerIndex];
        const parsedCourses = [];
        let skipped = 0;
        for (let rowIndex = matrixInfo.headerIndex + 1; rowIndex < grid.length; rowIndex += 1) {
          const row = grid[rowIndex];
          if (!row || !row.some(Boolean)) continue;
          const timeCandidates = [];
          if (matrixInfo.timeColumn >= 0) timeCandidates.push(cellText(row[matrixInfo.timeColumn]));
          timeCandidates.push(cellText(row[0]));
          let rowTime = null;
          for (const candidate of timeCandidates) {
            rowTime = parseTimeExpression(candidate) || parseSlotInfo(candidate);
            if (rowTime) break;
          }
          let rowHasCourse = false;
          for (const dayColumn of matrixInfo.dayColumns) {
            const day = parseWeekday(headerRow[dayColumn]);
            if (day === null) continue;
            const rawEntries = matrixEntryGroups(row[dayColumn]);
            for (const rawEntry of rawEntries) {
              if (/^(无|空|\/|-|—|暂无课程)$/.test(rawEntry)) continue;
              rowHasCourse = true;
              const entryTime = parseTimeExpression(rawEntry);
              const time = entryTime || rowTime;
              if (!time || !time.start || !time.end) {
                skipped += 1;
                continue;
              }
              const parsed = parseCourseNameAndMeta(stripClockRanges(rawEntry));
              if (!parsed.name) {
                skipped += 1;
                continue;
              }
              parsedCourses.push({
                name: parsed.name,
                day,
                start: time.start,
                end: time.end,
                place: parsed.place || "",
                teacher: parsed.teacher || "",
                color: colorFromText(parsed.name)
              });
            }
          }
          if (!rowHasCourse && rowTime && grid.slice(rowIndex + 1).some((nextRow) => nextRow.some(Boolean))) {
            // keep scanning; row may be an empty spacer inside the matrix
          }
        }
        return { courses: parsedCourses, skipped };
      }

      function handleGrid(grid, fileName) {
        const cleanGrid = grid
          .map((row) => row.map(cellText))
          .filter((row) => row.some((cell) => cell !== ""));
        if (!cleanGrid.length) {
          showImportError("这个文件里没有可识别的表格内容");
          return;
        }

        importGrid = cleanGrid;
        importFileName = fileName;
        importFileHint.textContent = fileName;
        const matrixInfo = detectMatrixGrid(cleanGrid);

        if (matrixInfo) {
          importMatrixInfo = matrixInfo;
          importHeaderIndex = -1;
          importDataRows = [];
          mappingArea.hidden = true;
          const result = parseMatrixGrid(cleanGrid, matrixInfo);
          renderImportResult(result);
          return;
        }

        importMatrixInfo = null;
        const headerIndex = findListHeaderIndex(cleanGrid);
        importHeaderIndex = headerIndex;
        const headers = cleanGrid[headerIndex] || [];
        importDataRows = cleanGrid.slice(headerIndex + 1).filter((row) => row.length >= 2);
        fillMappingSelects(headers);
        mappingArea.hidden = false;
        const mappings = readListMappings();
        const result = parseListRows(headers, importDataRows, mappings);
        renderImportResult(result);
      }

              <td>${course.teacher ? escapeHtml(course.teacher) : "—"}</td>
            </tr>

        }).join("");
      }

      function uniqueCourseKey(course) {
        return [course.name, course.day, course.start, course.end, course.place, course.teacher].join("|");
      }

      function openImportDialog(target = "mine") {

        mergeModeLabel.textContent = isFriend ? "追加到同学课表" : "追加到现有课表";
        fileInput.value = "";

      async function decodeFileText(file) {
        const buffer = await file.arrayBuffer();
        const utf8 = new TextDecoder("utf-8").decode(buffer);
        if (!utf8.includes("\uFFFD")) return utf8;
        try {
          return new TextDecoder("gbk").decode(buffer);
        } catch (error) {
          console.warn("GBK 解码不可用", error);
        }
        return utf8;
      }

      function injectScript(url) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          let settled = false;
          const timer = setTimeout(() => {
            if (!settled) {
              settled = true;
              script.remove();
              reject(new Error("加载超时"));
            }
          }, 10000);
          script.src = url;
          script.onload = () => {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              resolve();
            }
          };
          script.onerror = () => {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              script.remove();
              reject(new Error("加载失败"));
            }
          };
          document.head.appendChild(script);
        });
      }

      async function loadSheetJSLibrary() {
        if (window.XLSX) return;
        const sources = [
          "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
          "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js",
          "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
        ];
        for (const source of sources) {
          try {
            await injectScript(source);
            if (window.XLSX) return;
          } catch (error) {
            console.warn("加载表格解析组件失败", error);
          }
        }
        throw new Error("无法加载表格解析组件，请确认网络可用或先导出为 CSV 文件");
      }

      async function readWorkbookGrid(file) {
        await loadSheetJSLibrary();
        const buffer = await file.arrayBuffer();
        const workbook = window.XLSX.read(buffer, { type: "array" });
        if (!workbook.SheetNames.length) throw new Error("Excel 文件里没有工作表");
        let chosenSheet = workbook.Sheets[workbook.SheetNames[0]];
        let bestCount = -1;
        workbook.SheetNames.forEach((sheetName) => {
          const sheet = workbook.Sheets[sheetName];
          const cellCount = sheet && Object.keys(sheet).filter((key) => key.startsWith("!") === false).length;
          if (cellCount > bestCount) {
            bestCount = cellCount;
            chosenSheet = sheet;
          }
        });
        return window.XLSX.utils.sheet_to_json(chosenSheet, { header: 1, raw: false, defval: "" });
      }

      async function loadPdfJSLibrary() {
        if (window.pdfjsLib) return;
        const sources = [
          "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
          "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"
        ];
        for (const source of sources) {
          try {
            await injectScript(source);
            if (window.pdfjsLib) {
              window.pdfjsLib.GlobalWorkerOptions.workerSrc = source.replace("pdf.min.js", "pdf.worker.min.js");
              return;
            }
          } catch (error) {
            console.warn("加载 PDF 解析组件失败", error);
          }
        }
        throw new Error("无法加载 PDF 解析组件，请确认网络可用");
      }

      function pdfTextItemsToRows(items) {
        const positioned = [];
        items.forEach((item) => {
          const raw = item.str || "";
          if (!raw.trim()) return;
          const transform = item.transform || [1, 0, 0, 1, 0, 0];
          positioned.push({
            text: raw.trim(),
            x: transform[4] || 0,
            y: transform[5] || 0,
            scale: Math.abs(transform[0]) || 1,
            width: Math.abs(item.width || 0) * (Math.abs(transform[0]) || 1)
          });
        });
        positioned.sort((a, b) => b.y - a.y || a.x - b.x);

        const textLines = [];
        let currentLine = [];
        let currentY = null;
        for (const item of positioned) {
          if (currentLine.length && Math.abs(item.y - currentY) > 3.5) {
            textLines.push(currentLine);
            currentLine = [];
          }
          if (!currentLine.length) currentY = item.y;
          currentLine.push(item);
        }
        if (currentLine.length) textLines.push(currentLine);

        return textLines.map((line) => {
          line.sort((a, b) => a.x - b.x);
          const cells = [];
          const xPositions = [];
          let cell = "";
          let cellX = null;
          let rightEdge = line[0].x + line[0].width;
          for (let index = 0; index < line.length; index += 1) {
            const item = line[index];
            const gap = item.x - rightEdge;
            if (gap > 6) {
              if (cell) {
                cells.push(cell);
                xPositions.push(cellX);
              }
              cell = item.text;
              cellX = item.x;
              rightEdge = item.x + item.width;
            } else {
              cell += ` ${item.text}`;
              if (cellX === null) cellX = item.x;
              rightEdge = Math.max(rightEdge, item.x + item.width);
            }
          }
          if (cell) {
            cells.push(cell);
            xPositions.push(cellX);
          }
          return { cells, xPositions };
        }).filter((row) => row.cells.some((cell) => cell !== ""));
      }

      function choosePdfHeaderLine(lines) {
        let bestIndex = -1;
        let bestScore = 3;
        const searchEnd = Math.min(lines.length, 15);
        for (let index = 0; index < searchEnd; index += 1) {
          const cells = lines[index].cells;
          let score = 0;
          cells.forEach((cell) => {
            if (parseWeekday(cell) !== null) score += 3;
            if (/课程|科目|星期|周几|时间|节次|教师|老师|地点|教室|名称/.test(cell)) score += 1;
          });
          if (score > bestScore && cells.length >= 3) {
            bestScore = score;
            bestIndex = index;
          }
        }
        return bestIndex;
      }

      function alignPdfRows(lines, headerIndex) {
        const headerXs = lines[headerIndex].xPositions;
        return lines.map((line) => {
          const cells = Array.from({ length: headerXs.length }, () => "");
          line.cells.forEach((cell, cellIndex) => {
            let nearest = 0;
            let nearestDistance = Infinity;
            headerXs.forEach((headerX, columnIndex) => {
              const distance = Math.abs((line.xPositions[cellIndex] || 0) - headerX);
              if (distance < nearestDistance) {
                nearestDistance = distance;
                nearest = columnIndex;
              }
            });
            cells[nearest] = cells[nearest] ? `${cells[nearest]} ${cell}` : cell;
          });
          return cells;
        });
      }

      async function readPdfGrid(file) {
        await loadPdfJSLibrary();
        const buffer = await file.arrayBuffer();
        const task = window.pdfjsLib.getDocument({ data: new Uint8Array(buffer) });
        const pdf = await task.promise;
        const rawLines = [];
        try {
          const pageCount = Math.min(pdf.numPages, 40);
          for (let pageNumber = 1; pageNumber <= pageCount; pageNumber += 1) {
            const page = await pdf.getPage(pageNumber);
            const content = await page.getTextContent();
            rawLines.push(...pdfTextItemsToRows(content.items));
          }
        } finally {
          await pdf.destroy();
        }
        if (!rawLines.length) throw new Error("这份 PDF 里没有可读取的文字，扫描图片需要先转成文字 PDF");
        const headerIndex = choosePdfHeaderLine(rawLines);
        return headerIndex >= 0 ? alignPdfRows(rawLines, headerIndex) : rawLines.map((line) => line.cells);
      }

      async function handleImportFile(file) {
        if (!file) return;
        clearImportError();
        importFileHint.textContent = file.name;
        const lowerName = file.name.toLowerCase();
        try {
          if (lowerName.endsWith(".xlsx") || lowerName.endsWith(".xls")) {
            const grid = await readWorkbookGrid(file);
            handleGrid(grid, file.name);
          } else if (lowerName.endsWith(".pdf")) {
            const grid = await readPdfGrid(file);
            handleGrid(grid, file.name);
          } else {
            const text = await decodeFileText(file);
            const delimiter = detectDelimiter(text);
            handleGrid(parseDelimitedText(text, delimiter), file.name);
          }
        } catch (error) {
          console.warn("导入失败", error);
          showImportError(error.message || "读取文件失败，请换一个文件试试");
        }
      }

      function applyPendingImport() {
        if (!pendingCourses.length) return;
        const mode = importDialog.querySelector('input[name="importMode"]:checked')?.value || "replace";
        const seen = new Set();
        const normalized = pendingCourses.map((course) => ({
          ...course,
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`
        })).filter((course) => {
          const key = uniqueCourseKey(course);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });

        const isFriend = importTarget === "friend";
        const target = isFriend ? friendCourses : courses;
        if (mode === "merge") {
          const existingKeys = new Set(target.map(uniqueCourseKey));
          const additions = normalized.filter((course) => !existingKeys.has(uniqueCourseKey(course)));
          if (isFriend) {
            friendCourses = friendCourses.concat(additions);
          } else {
            courses = courses.concat(additions);
          }
        } else {
          if (isFriend) {
            friendCourses = normalized;
          } else {
            courses = normalized;
          }
        }
        const updatedCourses = isFriend ? friendCourses : courses;
        updatedCourses.sort((a, b) => a.day - b.day || timeToMinutes(a.start) - timeToMinutes(b.start));
        if (isFriend) saveFriendCourses(); else saveCourses();
        render();
        closeImportDialog();
      }

      function currentMonday() {
        const now = new Date();
        const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        monday.setDate(monday.getDate() - ((now.getDay() + 6) % 7));
        return monday;
      }

      function todayIndex() {
        return (new Date().getDay() + 6) % 7;
      }

      function dateText(date) {
        return `${date.getMonth() + 1}/${date.getDate()}`;
      }

      function formatDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function currentWeekDate(dayIndex) {
        const monday = currentMonday();
        const date = new Date(monday);
        date.setDate(monday.getDate() + dayIndex);
        return date;
      }

      function courseAttendanceKey(course) {
        const date = currentWeekDate(course.day || 0);
        return `${formatDateKey(date)}|${course.id}`;
      }

      function isOccurrenceFinished(course, date) {
        const now = new Date();
        const end = course.end || "22:00";
        const [endHour, endMinute] = end.split(":").map(Number);
        const endAt = new Date(date.getFullYear(), date.getMonth(), date.getDate(), endHour, endMinute);
        return endAt.getTime() <= now.getTime();
      }

      function isCourseLiveNow(course) {
        if ((course.day || 0) !== todayIndex()) return false;
        const nowMinutes = new Date().getHours() * 60 + new Date().getMinutes();
        const startMinutes = timeToMinutes(course.start || "08:00");
        const endMinutes = timeToMinutes(course.end || "22:00");
        return nowMinutes >= startMinutes && nowMinutes < endMinutes;
      }

      function syncAttendance() {
        let changed = false;
        courses.forEach((course) => {
          if (!isCourseActiveInWeek(course, currentWeekNumber())) return;
          const date = currentWeekDate(course.day || 0);
          if (!isOccurrenceFinished(course, date)) return;
          const key = courseAttendanceKey(course);
          if (!attendance[key]) {
            attendance[key] = true;
            changed = true;
          }
        });
        if (changed) saveAttendance();
      }

      function isCourseChecked(course) {
        const record = attendance[courseAttendanceKey(course)];
        return record === true || Boolean(record && typeof record === "object" && record.checked === true);
      }

      function courseMoodValue(course) {
        const record = attendance[courseAttendanceKey(course)];
        if (!record || typeof record !== "object") return null;
        return MOOD_BY_VALUE[record.mood] ? record.mood : null;
      }

      function setCourseMood(course, mood) {
        const date = currentWeekDate(course.day || 0);
        if (!isOccurrenceFinished(course, date)) return;
        const key = courseAttendanceKey(course);
        const record = attendance[key] && typeof attendance[key] === "object"
          ? { ...attendance[key] }
          : { checked: true, mood: null };
        record.checked = true;
        record.mood = MOOD_BY_VALUE[mood] ? mood : null;
        attendance[key] = record;
        saveAttendance();
        render();
      }

      function renderHeader() {
        const now = new Date();
        const weekday = WEEKDAYS[(now.getDay() + 6) % 7];
        const longWeekday = new Intl.DateTimeFormat("zh-CN", { weekday: "long" }).format(now);
        $("#todayCaption").textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · ${longWeekday}`;
        const activeCourses = visibleCourses();
        $("#courseCount").textContent = String(activeCourses.length);
        $("#todayCount").textContent = String(activeCourses.filter((course) => course.day === todayIndex()).length);

        const headerRow = $("#dayHeaderRow");
        headerRow.innerHTML = "";
        const corner = document.createElement("div");
        corner.className = "corner-cell";
        corner.textContent = "时间";
        headerRow.appendChild(corner);

        const monday = currentMonday();
        WEEKDAYS.forEach((name, index) => {
          const date = new Date(monday);
          date.setDate(monday.getDate() + index);
          const cell = document.createElement("div");
          cell.className = "day-head";
          if (index === todayIndex()) cell.classList.add("is-today");
          cell.innerHTML = `
            <span class="day-name">${name}${index === todayIndex() ? '<span class="today-tag">今天</span>' : ""}</span>
            <span class="day-date">${dateText(date)}</span>
          `;
          headerRow.appendChild(cell);
        });
      }

      function renderTimeAxis(axis) {
        axis.innerHTML = "";
        for (let hour = START_HOUR; hour <= END_HOUR - 1; hour += 1) {
          const label = document.createElement("span");
          label.className = "time-label";
          label.style.top = `${(hour - START_HOUR) * 52 + 5}px`;
          label.textContent = `${String(hour).padStart(2, "0")}:00`;
          axis.appendChild(label);
        }
      }

      function courseLayouts(dayCourses) {
        const sorted = [...dayCourses].sort((a, b) => {
          const startDiff = timeToMinutes(a.start) - timeToMinutes(b.start);
          if (startDiff !== 0) return startDiff;
          return timeToMinutes(b.end) - timeToMinutes(a.end);
        });

        const layouts = [];
        let group = [];
        let groupEnd = -Infinity;

        for (const course of sorted) {
          const start = timeToMinutes(course.start);
          const end = timeToMinutes(course.end);
          if (group.length && start >= groupEnd) {
            layouts.push(...arrangeGroup(group));
            group = [course];
            groupEnd = end;
          } else {
            group.push(course);
            groupEnd = Math.max(groupEnd, end);
          }
        }
        if (group.length) layouts.push(...arrangeGroup(group));
        return layouts;
      }

      function arrangeGroup(group) {
        const occupied = [];
        const arranged = [];
        for (const course of group) {
          const start = timeToMinutes(course.start);
          const end = timeToMinutes(course.end);
          let col = occupied.findIndex((occupiedEnd) => occupiedEnd <= start);
          if (col === -1) col = occupied.length;
          occupied[col] = end;
          arranged.push({ course, col });
        }
        return arranged.map((item) => ({ ...item, colCount: occupied.length }));
      }

      function courseAriaLabel(course) {
        const bits = [
          course.name,
          `${course.dayName} ${course.start} 到 ${course.end}`,
          course.place,
          course.teacher
        ].filter(Boolean);
        return bits.join("，");
      }

      function renderCourse(course, col, colCount) {
        const totalMinutes = (END_HOUR - START_HOUR) * 60;
        const gridHeight = 728;
        const start = timeToMinutes(course.start);
        const end = timeToMinutes(course.end);
        const top = ((start - START_HOUR * 60) / totalMinutes) * gridHeight + 2;
        const height = ((end - start) / totalMinutes) * gridHeight - 4;
        const leftPercent = (col / colCount) * 100;
        const widthPercent = 100 / colCount;

        const card = document.createElement("button");
        card.type = "button";
        card.className = `course-card c-${course.color}`;
        if (height < 52) card.classList.add("is-compact");
        if (height < 36) card.classList.add("is-tiny");
        card.style.top = `${Math.max(2, top)}px`;
        card.style.height = `${Math.max(30, height)}px`;
        card.style.left = `calc(${leftPercent}% + 3px)`;
        card.style.width = `calc(${widthPercent}% - 6px)`;
        card.dataset.id = course.id;
        card.dataset.day = course.day;
        const checked = isCourseChecked(course);
        const live = !checked && isCourseLiveNow(course);
        const moodValue = checked ? courseMoodValue(course) : null;
        const mood = moodValue ? MOOD_BY_VALUE[moodValue] : null;
        if (checked) card.classList.add("is-done");
        if (live) card.classList.add("is-live");
        if (mood) card.classList.add("has-mood");
        card.setAttribute(
          "aria-label",
          `${courseAriaLabel(course)}${checked ? "，已自动打卡" : live ? "，上课中" : ""}${mood ? `，心情：${mood.label}` : ""}`
        );

        const metaBits = [course.place, course.teacher].filter(Boolean).join(" · ");
        const mapIcon = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        `;
        const attendanceBadge = checked
          ? `<span class="attendance-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>`
          : "";
        const moodBadge = mood
          ? `<span class="mood-badge" title="${mood.label}" aria-label="${mood.label}">${mood.emoji}</span>`
          : "";
        const tagValue = course.tag && TAG_BY_VALUE[course.tag] ? course.tag : "";
        const tag = tagValue ? TAG_BY_VALUE[tagValue] : null;
        const tagMarkup = tag
          ? `<span class="course-tag t-${tag.value}">${tag.label}</span>`
          : "";
        card.innerHTML = `
          <span class="course-time">${course.start} - ${course.end}</span>
          <strong class="course-title">${escapeHtml(course.name)}</strong>
          ${metaBits ? `<span class="course-meta">${mapIcon}<span>${escapeHtml(metaBits)}</span></span>` : ""}
          ${tagMarkup}
          ${attendanceBadge}
          ${moodBadge}
        `;
        card.addEventListener("click", () => openDialog(course));
        return card;
      }

      function renderSchedule() {
        const body = $("#scheduleBody");
        body.innerHTML = "";

        const axis = document.createElement("div");
        axis.className = "time-axis";
        renderTimeAxis(axis);
        body.appendChild(axis);

        const columns = WEEKDAYS.map((_, index) => {
          const column = document.createElement("div");
          column.className = "day-column";
          column.dataset.day = index;
          if (index === todayIndex()) column.classList.add("is-today");
          const gridLines = document.createElement("div");
          gridLines.className = "grid-lines";
          column.appendChild(gridLines);
          body.appendChild(column);
          return column;
        });

        const byDay = Array.from({ length: 7 }, () => []);
        visibleCourses().forEach((course) => byDay[course.day]?.push(course));

        byDay.forEach((dayCourses, day) => {
          courseLayouts(dayCourses).forEach(({ course, col, colCount }) => {
            columns[day].appendChild(renderCourse(course, col, colCount));
          });
        });

        if (!courses.length) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.style.display = "block";
          note.style.left = "calc(50% + var(--gutter) / 2)";
          note.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M8 3v4"></path>
              <path d="M16 3v4"></path>
              <path d="M3 9h18"></path>
            </svg>
            本周还没有课程
          `;
          body.appendChild(note);
        }

        updateNowLine();
      }

      function renderAgenda() {
        const monday = currentMonday();
        agendaDays.innerHTML = WEEKDAYS.map((dayName, index) => {
          const date = new Date(monday);
          date.setDate(monday.getDate() + index);
          const classes = ["agenda-day"];
          if (index === todayIndex()) classes.push("is-today");
          if (index === agendaDay) classes.push("is-active");
          return `
            <button class="${classes.join(" ")}" type="button" data-agenda-day="${index}">
              <b>${dayName}</b>
              <small>${dateText(date)}</small>
            </button>
          `;
        }).join("");

        renderTimeline();
      }

      function renderTimelineAxis() {
        timelineAxis.innerHTML = "";
        for (let hour = START_HOUR; hour < END_HOUR; hour += 1) {
          const label = document.createElement("span");
          label.className = "timeline-time";
          label.style.top = `${(hour - START_HOUR) * 60 + 7}px`;
          label.textContent = `${String(hour).padStart(2, "0")}:00`;
          timelineAxis.appendChild(label);
        }
      }

      function renderTimelineCourse(course, col, colCount) {
        const timelineMinutes = (END_HOUR - START_HOUR) * 60;
        const start = timeToMinutes(course.start);
        const end = timeToMinutes(course.end);
        const top = ((start - START_HOUR * 60) / timelineMinutes) * 840 + 3;
        const height = ((end - start) / timelineMinutes) * 840 - 6;
        const leftPercent = (col / colCount) * 100;
        const widthPercent = 100 / colCount;
        const checked = isCourseChecked(course);
        const live = !checked && isCourseLiveNow(course);
        const moodValue = checked ? courseMoodValue(course) : null;
        const mood = moodValue ? MOOD_BY_VALUE[moodValue] : null;
        const meta = [course.place, course.teacher].filter(Boolean).join(" · ");
        const card = document.createElement("button");
        card.type = "button";
        card.className = `timeline-course c-${course.color}`;
        if (mood) card.classList.add("has-mood");
        card.dataset.id = course.id;
        card.style.top = `${Math.max(3, top)}px`;
        card.style.height = `${Math.max(34, height)}px`;
        card.style.left = `calc(${leftPercent}% + 3px)`;
        card.style.width = `calc(${widthPercent}% - 6px)`;
        card.setAttribute(
          "aria-label",
          `${escapeHtml(courseAriaLabel(course))}${checked ? "，已自动打卡" : live ? "，上课中" : ""}${mood ? `，心情：${mood.label}` : ""}`
        );
        const attendanceBadge = checked
          ? `<span class="attendance-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>`
          : "";
        const moodBadge = mood
          ? `<span class="mood-badge" title="${mood.label}" aria-label="${mood.label}">${mood.emoji}</span>`
          : "";
        const tagValue = course.tag && TAG_BY_VALUE[course.tag] ? course.tag : "";
        const tag = tagValue ? TAG_BY_VALUE[tagValue] : null;
        const tagMarkup = tag
          ? `<span class="course-tag t-${tag.value}">${tag.label}</span>`
          : "";
        card.innerHTML = `
          <span class="course-time">${course.start} - ${course.end}</span>
          <strong class="course-title">${escapeHtml(course.name)}</strong>
          ${meta ? `<span class="course-meta"><span>${escapeHtml(meta)}</span></span>` : ""}
          ${tagMarkup}
          ${attendanceBadge}
          ${moodBadge}
        `;
        return card;
      }

      function renderTimeline() {
        renderTimelineAxis();
        const dayCourses = visibleCourses().filter((course) => course.day === agendaDay);
        timelineTrack.innerHTML = "";

        if (!dayCourses.length) {
          const empty = document.createElement("div");
          empty.className = "timeline-empty";
          empty.textContent = "这一天没有课程";
          timelineTrack.appendChild(empty);
        } else {
          courseLayouts(dayCourses).forEach(({ course, col, colCount }) => {
            timelineTrack.appendChild(renderTimelineCourse(course, col, colCount));
          });
        }

        timelineTrack.querySelectorAll(".timeline-now").forEach((line) => line.remove());
        if (agendaDay !== todayIndex()) return;
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const fromStart = nowMinutes - START_HOUR * 60;
        if (fromStart < 0 || fromStart > (END_HOUR - START_HOUR) * 60) return;
        const line = document.createElement("div");
        line.className = "timeline-now";
        line.style.top = `${(fromStart / ((END_HOUR - START_HOUR) * 60)) * 840}px`;
        timelineTrack.appendChild(line);
      }

      function dateKey(date) {
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${date.getFullYear()}-${month}-${day}`;
      }

      function weekdayIndex(date) {
        return (date.getDay() + 6) % 7;
      }

      function weekNumberForDate(date) {
        const diff = Math.floor((date - SEMESTER_START) / (7 * 24 * 60 * 60 * 1000));
        return Math.max(1, diff + 1);
      }

      function currentWeekNumber() {
        return weekNumberForDate(new Date());
      }

      function isCourseActiveInWeek(course, weekNumber = currentWeekNumber()) {
        const rule = course.weekRule || "all";
        if (rule === "odd") return weekNumber % 2 === 1;
        if (rule === "even") return weekNumber % 2 === 0;
        if (rule === "range3to12") return weekNumber >= 3 && weekNumber <= 12;
        return true;
      }

      function visibleCourses(weekNumber = currentWeekNumber()) {
        return courses.filter((course) => isCourseActiveInWeek(course, weekNumber));
      }

      function visibleFriendCourses(weekNumber = currentWeekNumber()) {
        return friendCourses.filter((course) => isCourseActiveInWeek(course, weekNumber));
      }

      function durationLabel(minutes) {
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        if (hours && rest) return `${hours}小时${rest}分`;
        if (hours) return `${hours}小时`;
        return `${minutes}分钟`;
      }

      function commonFreeSlots() {
        const mineByDay = courses.filter((course) => isCourseActiveInWeek(course) && Number.isFinite(timeToMinutes(course.start)) && Number.isFinite(timeToMinutes(course.end)));
        const friendByDay = friendCourses.filter((course) => isCourseActiveInWeek(course) && Number.isFinite(timeToMinutes(course.start)) && Number.isFinite(timeToMinutes(course.end)));
        const dayStart = START_HOUR * 60;
        const dayEnd = END_HOUR * 60;
        const slots = [];

        for (let day = 0; day < 7; day += 1) {
          const busy = mineByDay
            .concat(friendByDay)
            .filter((course) => course.day === day)
            .map((course) => ({
              start: Math.max(dayStart, timeToMinutes(course.start)),
              end: Math.min(dayEnd, timeToMinutes(course.end))
            }))
            .filter((range) => range.end > range.start)
            .sort((a, b) => a.start - b.start || a.end - b.end);

          const merged = [];
          busy.forEach((range) => {
            const last = merged[merged.length - 1];
            if (last && range.start <= last.end) {
              last.end = Math.max(last.end, range.end);
            } else {
              merged.push({ ...range });
            }
          });

          let cursor = dayStart;
          merged.forEach((range) => {
            if (range.start > cursor && range.start - cursor >= MIN_DURATION) {
              slots.push({ day, start: cursor, end: range.start });
            }
            cursor = Math.max(cursor, range.end);
          });
          if (dayEnd - cursor >= MIN_DURATION) {
            slots.push({ day, start: cursor, end: dayEnd });
          }
        }

        return slots.sort((a, b) => a.day - b.day || a.start - b.start);
      }

      function renderCompare() {
        const mine = visibleCourses();
        const friend = visibleFriendCourses();
        const slots = commonFreeSlots();

        compareSummary.textContent = friend.length
          ? `按本周课表自动对比，找到 ${WEEKDAYS.length} 天中至少 ${durationLabel(MIN_DURATION)} 的共同空闲时段。`
          : "导入同学课表后，会自动找出两个人的共同空闲时间段。";

        if (!friend.length) {
          const friendCount = friendCourses.length;
          compareStats.innerHTML = `
            <div class=\"compare-stat\"><b>${mine.length}</b><span>我的本周课程</span></div>
            <div class=\"compare-stat\"><b>${friendCount}</b><span>同学课程</span></div>
            <div class=\"compare-stat\"><b>0</b><span>共同空闲</span></div>
            <div class=\"compare-stat\"><b>0</b><span>最长空闲</span></div>
          `;
          compareList.innerHTML = `<p class=\"compare-empty\">${friendCount ? "当前周同学课表没有有效课程，检查一下开课周设置或者换一个同学课表试试。" : "还没有同学课表，先点击右上角“导入同学课表”，也可以把同学的 CSV / Excel / PDF 课表拖进来。"}</p>`;
          return;
        }

        const longest = slots.reduce((max, slot) => Math.max(max, slot.end - slot.start), 0);
        compareStats.innerHTML = `
          <div class=\"compare-stat\"><b>${mine.length}</b><span>我的本周课程</span></div>
          <div class=\"compare-stat\"><b>${friend.length}</b><span>同学本周课程</span></div>
          <div class=\"compare-stat\"><b>${slots.length}</b><span>共同空闲</span></div>
          <div class=\"compare-stat\"><b>${slots.length ? durationLabel(longest) : "0"}</b><span>最长空闲</span></div>
        `;

        if (!slots.length) {
          compareList.innerHTML = `<p class=\"compare-empty\">本周没有找到共同空闲时段，试试把统计范围拉长，或调整一下课表再看看。</p>`;
          return;
        }

        compareList.innerHTML = slots.map((slot) => {
          const minutes = slot.end - slot.start;
          return `
            <div class=\"free-slot\" data-day=\"${slot.day}\">
              <div class=\"free-slot-day\">${WEEKDAYS[slot.day]}</div>
              <div class=\"free-slot-time\">${minutesToTime(slot.start)} - ${minutesToTime(slot.end)}</div>
              <div class=\"free-slot-duration\">${durationLabel(minutes)}</div>
            </div>
          `;
        }).join("");
      }

      function isTodayDate(date) {
        const now = new Date();
        return dateKey(date) === dateKey(now);
      }

      function formatDateLong(date) {
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function dateLoadInfo(date) {
        const day = weekdayIndex(date);
        const week = weekNumberForDate(date);
        const dayCourses = courses.filter((course) => course.day === day && isCourseActiveInWeek(course, week));
        const minutes = dayCourses.reduce((sum, course) => {
          return sum + (timeToMinutes(course.end) - timeToMinutes(course.start));
        }, 0);
        return { count: dayCourses.length, minutes };
      }

      function nextUpcomingCourse() {
        const today = todayIndex();
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        return courses
          .filter((course) => course.day === today && isCourseActiveInWeek(course))
          .filter((course) => timeToMinutes(course.start) > nowMinutes)
          .sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start))[0] || null;
      }

      function maybeNotifyDeparture(course) {
        if (!commuteSetting.notify || !course) return;
        if (!("Notification" in window)) return;
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const leave = departureMinutesFor(course);
        const start = timeToMinutes(course.start);
        if (nowMinutes < leave || nowMinutes >= start) return;
        const key = `${dateKey(now)}|${course.id}|${leave}`;
        if (lastCommuteReminderKey === key) return;
        if (Notification.permission === "granted") {
          lastCommuteReminderKey = key;
          new Notification("该出门上课了", {
            body: `${course.name} ${course.start} 上课，现在从${commuteSetting.origin}出发刚好能到。`
          });
        }
      }

      function renderCommute() {
        const next = nextUpcomingCourse();
        if (!next) {
          commuteBar.hidden = true;
          commuteBar.classList.remove("is-leave");
          return;
        }

        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const leave = departureMinutesFor(next);
        const start = timeToMinutes(next.start);
        const commuteMinutes = commuteMinutesFor(next);
        const place = next.place || "教室未填";

        commuteTitle.textContent = "下一门课";
        commuteDetail.textContent = `${next.name} · ${place} · ${next.start} 上课 · 从${commuteSetting.origin}步行约${commuteMinutes}分钟`;
        commuteDepart.textContent = `建议 ${minutesToTime(leave)} 出发`;

        const beforeLeave = leave - nowMinutes;
        if (beforeLeave > 0) {
          commuteCountdown.textContent = `还有 ${durationLabel(beforeLeave)} 出门`;
          commuteBar.classList.remove("is-leave");
        } else if (nowMinutes >= leave && nowMinutes < start) {
          commuteCountdown.textContent = "现在该出门了";
          commuteBar.classList.add("is-leave");
        } else {
          commuteCountdown.textContent = `${start - nowMinutes} 分钟后上课`;
          commuteBar.classList.remove("is-leave");
        }

        commuteBar.hidden = false;
        maybeNotifyDeparture(next);
      }

      function loadLevel(minutes) {
        return Math.max(0, LOAD_LEVELS.findIndex((level) => minutes <= level.max));
      }

      function loadColor(minutes) {
        return LOAD_LEVELS[loadLevel(minutes)].color;
      }

      function getHeatmapMonths() {
        const months = [];
        const cursor = new Date(SEMESTER_START);
        while (cursor <= SEMESTER_END) {
          const monthName = `${cursor.getFullYear()}年${cursor.getMonth() + 1}月`;
          let block = months.find((item) => item.name === monthName);
          if (!block) {
            block = { name: monthName, days: [] };
            months.push(block);
          }
          const info = dateLoadInfo(cursor);
          block.days.push({
            date: new Date(cursor),
            count: info.count,
            minutes: info.minutes
          });
          cursor.setDate(cursor.getDate() + 1);
        }
        return months;
      }

      function renderHeatmap() {
        heatmapRange.textContent = `${formatDateLong(SEMESTER_START)} - ${formatDateLong(SEMESTER_END)}`;
        heatmapLegend.innerHTML = LOAD_LEVELS.map((level) => (
          `<span class="legend-chip"><span style="background:${level.color}"></span>${level.label}</span>`
        )).join("");
        const months = getHeatmapMonths();
        heatmapGrid.innerHTML = months.map((block) => {
          const firstDate = block.days[0].date;
          const lead = weekdayIndex(firstDate);
          const trail = (7 - ((lead + block.days.length) % 7)) % 7;
          const emptyCell = () => `<div class="heatmap-day empty"></div>`;
          const cells = Array.from({ length: lead }, emptyCell).concat(
            block.days.map((item) => {
              const level = LOAD_LEVELS[loadLevel(item.minutes)];
              const todayClass = isTodayDate(item.date) ? " is-today" : "";
              const note = item.count ? `${item.count}节` : "闲";
              const title = `${formatDateLong(item.date)} · ${item.count ? `${item.count}节 · ${item.minutes}分钟` : "无课"}`;
              return `<div class="heatmap-day ${level.className}${todayClass}" title="${title}"><b>${item.date.getDate()}</b><small>${note}</small></div>`;
            })
          ).concat(Array.from({ length: trail }, emptyCell));
          const weekdays = WEEKDAY_NAMES.map((name) => `<span class="heatmap-weekday">${name}</span>`).join("");
          return `<section class="heatmap-month"><h4 class="heatmap-month-name">${block.name}</h4><div class="heatmap-weekdays">${weekdays}</div><div class="heatmap-days">${cells.join("")}</div></section>`;
        }).join("");
      }

      function roundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + width, y, x + width, y + height, radius);
        ctx.arcTo(x + width, y + height, x, y + height, radius);
        ctx.arcTo(x, y + height, x, y, radius);
        ctx.arcTo(x, y, x + width, y, radius);
        ctx.closePath();
      }

      function drawHeatmapCanvas() {
        const months = getHeatmapMonths();
        const cellW = 118;
        const cellH = 44;
        const gap = 6;
        const pad = 56;
        const headerH = 130;
        const blockHeaderH = 46;
        const monthPad = 16;
        const legendH = 76;
        const weeksHeight = months.reduce((sum, block) => {
          const lead = weekdayIndex(block.days[0].date);
          const weeks = Math.ceil((lead + block.days.length) / 7);
          return sum + weeks * (cellH + gap) - gap;
        }, 0);
        const canvasH = headerH + months.length * (blockHeaderH + monthPad * 2) + weeksHeight + legendH;
        const canvasW = pad * 2 + 7 * (cellW + gap) - gap;
        const canvas = document.createElement("canvas");
        canvas.width = canvasW;
        canvas.height = Math.max(520, canvasH);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "left";
        ctx.fillStyle = "#3d3c52";
        ctx.font = "700 36px 'Microsoft YaHei', 'PingFang SC', sans-serif";
        ctx.fillText("粽子课表 · 学期课程热力图", pad, 78);
        ctx.fillStyle = "#9291a5";
        ctx.font = "18px 'Microsoft YaHei', 'PingFang SC', sans-serif";
        ctx.fillText(`${formatDateLong(SEMESTER_START)} - ${formatDateLong(SEMESTER_END)}`, pad, 108);
        let y = headerH;
        months.forEach((block) => {
          ctx.fillStyle = "#3d3c52";
          ctx.font = "700 24px 'Microsoft YaHei', 'PingFang SC', sans-serif";
          ctx.fillText(block.name, pad + 2, y + 22);
          y += 28;
          ctx.fillStyle = "#9291a5";
          ctx.font = "13px 'Microsoft YaHei', 'PingFang SC', sans-serif";
          WEEKDAY_NAMES.forEach((name, index) => {
            ctx.fillText(name, pad + 4 + index * (cellW + gap), y);
          });
          y += 18;
          const lead = weekdayIndex(block.days[0].date);
          const weeks = Math.ceil((lead + block.days.length) / 7);
          for (let row = 0; row < weeks; row += 1) {
            for (let col = 0; col < 7; col += 1) {
              const index = row * 7 + col - lead;
              if (index < 0 || index >= block.days.length) continue;
              const item = block.days[index];
              const x = pad + col * (cellW + gap);
              const cellY = y + row * (cellH + gap);
              ctx.fillStyle = loadColor(item.minutes);
              roundedRect(ctx, x, cellY, cellW, cellH, 14);
              ctx.fill();
              ctx.fillStyle = "#3d3c52";
              ctx.font = "700 16px 'Microsoft YaHei', sans-serif";
              ctx.fillText(String(item.date.getDate()), x + 10, cellY + 22);
              ctx.fillStyle = "#6f6c86";
              ctx.font = "12px 'Microsoft YaHei', sans-serif";
              ctx.fillText(item.count ? `${item.count}节` : "闲", x + 10, cellY + 38);
            }
          }
          y += weeks * (cellH + gap) - gap + monthPad * 2;
        });
        y += 10;
        LOAD_LEVELS.forEach((level, index) => {
          const x = pad + index * 140;
          ctx.fillStyle = level.color;
          roundedRect(ctx, x, y, 28, 28, 8);
          ctx.fill();
          ctx.fillStyle = "#6f6c86";
          ctx.font = "14px 'Microsoft YaHei', sans-serif";
          ctx.fillText(level.label, x + 36, y + 20);
        });
        return canvas;
      }

      function downloadHeatmap() {
        const canvas = drawHeatmapCanvas();
        const url = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.href = url;
        link.download = "粽子课表学期热力图.png";
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function applyViewMode() {
        const timeTab = document.querySelector('[data-schedule-view="time"]');
        const gridTab = document.querySelector('[data-schedule-view="grid"]');
        const heatmapTab = document.querySelector('[data-schedule-view="heatmap"]');
        const compareTab = document.querySelector('[data-schedule-view="compare"]');
        const tabs = [timeTab, gridTab, heatmapTab, compareTab];
        tabs.forEach((tab) => tab?.classList.remove("is-active"));
        if (viewMode === "grid") {
          gridView.hidden = false;
          agendaView.hidden = true;
          heatmapView.hidden = true;
          compareView.hidden = true;
          gridTab?.classList.add("is-active");
        } else if (viewMode === "heatmap") {
          gridView.hidden = true;
          agendaView.hidden = true;
          heatmapView.hidden = false;
          compareView.hidden = true;
          heatmapTab?.classList.add("is-active");
        } else if (viewMode === "compare") {
          gridView.hidden = true;
          agendaView.hidden = true;
          heatmapView.hidden = true;
          compareView.hidden = false;
          renderCompare();
          compareTab?.classList.add("is-active");
        } else {
          gridView.hidden = true;
          agendaView.hidden = false;
          heatmapView.hidden = true;
          compareView.hidden = true;
          timeTab?.classList.add("is-active");
        }
      }

      function updateNowLine() {
        document.querySelectorAll(".now-line").forEach((line) => line.remove());
        const now = new Date();
        const day = todayIndex();
        const column = document.querySelector(`.day-column[data-day="${day}"]`);
        if (!column) return;

        const totalMinutes = (END_HOUR - START_HOUR) * 60;
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const fromStart = nowMinutes - START_HOUR * 60;
        if (fromStart < 0 || fromStart > totalMinutes) return;

        const line = document.createElement("div");
        line.className = "now-line";
        line.style.top = `${(fromStart / totalMinutes) * 728}px`;
        column.appendChild(line);
      }

      function renderStats() {
        const activeCourses = visibleCourses();
        $("#courseCount").textContent = String(activeCourses.length);
        const today = todayIndex();
        const todayCourses = activeCourses.filter((course) => course.day === today);
        const doneToday = todayCourses.filter((course) => isCourseChecked(course)).length;
        $("#todayCount").textContent = String(todayCourses.length);
        $("#todayDoneCount").textContent = String(doneToday);
        $("#todayTotalCount").textContent = String(todayCourses.length);
      }

      function render() {
        syncAttendance();
        applyBackground();
        renderHeader();
        renderSchedule();
        renderAgenda();
        renderHeatmap();
        renderStats();
        renderCompare();
        renderCommute();
        applyViewMode();
      }

      function showError(message) {
        formError.textContent = message;
        formError.classList.add("visible");
        formError.scrollIntoView({ block: "nearest" });
      }

      function clearError() {
        formError.textContent = "";
        formError.classList.remove("visible");
      }

      function showBackgroundError(message) {
        backgroundError.textContent = message;
        backgroundError.classList.add("visible");
      }

      function clearBackgroundError() {
        backgroundError.textContent = "";
        backgroundError.classList.remove("visible");
      }

      function applyBackground() {
        const bodyElement = document.body;
        clearBackgroundError();
        if (backgroundSetting.kind === "image" && backgroundSetting.value) {
          bodyElement.style.background = `url("${backgroundSetting.value}") center / cover no-repeat fixed`;
          bodyElement.classList.add("has-custom-bg");
          return;
        }
        const preset = BG_PRESETS.find((item) => item.value === backgroundSetting.value) || BG_PRESETS[0];
        if (preset.value === "default") {
          bodyElement.style.background = "";
          bodyElement.classList.remove("has-custom-bg");
          return;
        }
        bodyElement.style.background = preset.preview;
        bodyElement.classList.add("has-custom-bg");
      }

      function renderBackgroundPresets() {
        backgroundPresets.innerHTML = BG_PRESETS.map((preset) => {
          const selected = backgroundSetting.kind === "preset" && backgroundSetting.value === preset.value;
          return `
            <button class="bg-option ${selected ? "is-selected" : ""}" type="button" data-background-preset="${preset.value}">
              <span style="background:${preset.preview}"></span>
              ${preset.label}
            </button>
          `;
        }).join("");
      }

      function openBackgroundDialog() {
        clearBackgroundError();
        renderBackgroundPresets();
        backgroundDialog.showModal();
      }

      function closeBackgroundDialog() {
        backgroundDialog.close();
        backgroundFile.value = "";
      }

      function chooseBackgroundPreset(presetValue) {
        const preset = BG_PRESETS.find((item) => item.value === presetValue);
        if (!preset) return;
        backgroundSetting = { kind: "preset", value: preset.value };
        saveBackground();
        applyBackground();
        renderBackgroundPresets();
        render();
      }

      function handleBackgroundFile(file) {
        if (!file) return;
        clearBackgroundError();
        if (!file.type.startsWith("image/")) {
          showBackgroundError("请选择图片文件");
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => showBackgroundError("读取图片失败");
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => showBackgroundError("图片格式无法识别");
          image.onload = () => {
            const maxWidth = 1920;
            const maxHeight = 1200;
            const ratio = Math.min(1, maxWidth / image.naturalWidth, maxHeight / image.naturalHeight);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
            const context = canvas.getContext("2d");
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.86);
            try {
              backgroundSetting = { kind: "image", value: dataUrl };
              saveBackground();
              applyBackground();
              renderBackgroundPresets();
              closeBackgroundDialog();
              render();
            } catch (error) {
              console.warn("保存背景失败", error);
              showBackgroundError("图片太大，请换一张小一点的图片");
            }
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      }

      function openCommuteDialog() {
        commuteError.textContent = "";
        commuteOriginInput.value = commuteSetting.origin;
        commuteDefaultInput.value = String(commuteSetting.defaultMinutes);
        commuteNotifySelect.value = commuteSetting.notify ? "on" : "off";
        renderCommuteRouteList();
        commuteDialog.showModal();
      }

      function closeCommuteDialog() {
        commuteDialog.close();
      }

      function renderCommuteRouteList() {
        const keys = [...new Set(courses.map((course) => buildingKey(course.place)).filter(Boolean))].sort();
        if (!keys.length) {
          commuteRouteList.innerHTML = `<p class="compare-empty">在课程“地点”里填教学楼后，就能按教学楼单独设置步行时间。</p>`;
          return;
        }
        commuteRouteList.innerHTML = keys.map((key) => {
          const minutes = commuteSetting.routes[key] !== undefined
            ? commuteSetting.routes[key]
            : commuteSetting.defaultMinutes;
          return `
            <label class="commute-route-row">
              <span>${escapeHtml(key)}</span>
              <input type="number" min="1" max="120" step="1" data-route-key="${escapeHtml(key)}" value="${escapeHtml(String(minutes))}" aria-label="${escapeHtml(key)}步行分钟">
              <span>分钟</span>
            </label>
          `;
        }).join("");
      }

      function saveCommuteDialog() {
        const origin = commuteOriginInput.value.trim() || "宿舍";
        const defaultMinutes = Math.min(120, Math.max(1, Number(commuteDefaultInput.value) || 10));
        const routes = {};
        commuteRouteList.querySelectorAll("[data-route-key]").forEach((input) => {
          const minutes = Math.round(Number(input.value));
          if (Number.isFinite(minutes)) {
            routes[input.dataset.routeKey] = Math.max(1, Math.min(120, minutes));
          }
        });
        commuteSetting = {
          origin,
          defaultMinutes,
          routes,
          notify: commuteNotifySelect.value === "on"
        };
        saveCommuteSetting();
        if (commuteSetting.notify && "Notification" in window && Notification.permission !== "granted") {
          const permissionRequest = Notification.requestPermission();
          if (permissionRequest && typeof permissionRequest.catch === "function") {
            permissionRequest.catch(() => {});
          }
        }
        closeCommuteDialog();
        render();
      }

      function resetCommuteSetting() {
        commuteSetting = { origin: "宿舍", defaultMinutes: 10, routes: {}, notify: false };
        saveCommuteSetting();
        commuteOriginInput.value = commuteSetting.origin;
        commuteDefaultInput.value = String(commuteSetting.defaultMinutes);
        commuteNotifySelect.value = "off";
        renderCommuteRouteList();
        render();
      }

      function buildFormOptions() {
        daySelect.innerHTML = WEEKDAYS.map((name, index) => `<option value="${index}">${name}</option>`).join("");
        startSelect.innerHTML = timeOptions("08:00", "21:00", 15);
        endSelect.innerHTML = timeOptions("08:15", "22:00", 15);

        colorSwatches.innerHTML = DAY_COLORS.map((color, index) => {
          const checked = index === 0 ? " checked" : "";
          return `
            <label class="swatch sw-${color}" title="${DAY_COLOR_LABELS[color]}">
              <input type="radio" name="color" value="${color}"${checked}>
              <span class="swatch-dot"></span>
            </label>
          `;
        }).join("");
      }

      function openDialog(course) {
        clearError();
        editingId = course ? course.id : null;
        const isEdit = Boolean(course);
        dialogTitle.textContent = isEdit ? "编辑课程" : "添加课程";
        dialogSub.textContent = isEdit && course
          ? `${WEEKDAYS[course.day]} · ${course.start}-${course.end}${isCourseChecked(course) ? " · 已自动打卡" : ""}`
          : "";
        dialogSub.hidden = !isEdit;
        deleteBtn.hidden = !isEdit;

        const defaultDay = course ? course.day : todayIndex();
        daySelect.value = String(defaultDay);
        weekRuleSelect.value = course?.weekRule || "all";
        tagSelect.value = course?.tag || "";
        nameInput.value = course ? course.name : "";
        placeInput.value = course ? (course.place || "") : "";
        teacherInput.value = course ? (course.teacher || "") : "";

        const defaultStart = course ? course.start : "08:30";
        startSelect.value = startSelect.querySelector(`option[value="${defaultStart}"]`) ? defaultStart : "08:00";
        const preferredEnd = course ? course.end : addMinutes(startSelect.value, 90);
        endSelect.value = endSelect.querySelector(`option[value="${preferredEnd}"]`) ? preferredEnd : "22:00";

        const color = course ? course.color : DAY_COLORS[courses.length % DAY_COLORS.length];
        const colorInput = colorSwatches.querySelector(`input[value="${color}"]`);
        if (colorInput) colorInput.checked = true;

        const currentMood = course ? courseMoodValue(course) : null;
        const finished = Boolean(course) && isOccurrenceFinished(course, currentWeekDate(course.day || 0));
        moodOptions.querySelectorAll(".mood-btn").forEach((button) => {
          button.disabled = !finished;
          button.classList.toggle("is-selected", button.dataset.mood === currentMood);
        });
        moodHint.textContent = !course
          ? "课程结束后可在这里记录心情"
          : finished
            ? (currentMood ? `已记录：${MOOD_BY_VALUE[currentMood].label}` : "课程已结束，选择今天的心情吧")
            : "课程结束后可在这里记录心情";

        nameInput.focus();
        dialog.showModal();
      }

      function closeDialog() {
        dialog.close();
        editingId = null;
      }

      function selectedColor() {
        return colorSwatches.querySelector("input[name='color']:checked")?.value || "mint";
      }

      function onStartChange() {
        const minEnd = addMinutes(startSelect.value, MIN_DURATION);
        const currentEnd = endSelect.value || minEnd;
        if (timeToMinutes(currentEnd) <= timeToMinutes(startSelect.value)) {
          endSelect.value = endSelect.querySelector(`option[value="${minEnd}"]`) ? minEnd : "22:00";
        } else if (timeToMinutes(currentEnd) - timeToMinutes(startSelect.value) < MIN_DURATION) {
          endSelect.value = endSelect.querySelector(`option[value="${minEnd}"]`) ? minEnd : "22:00";
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        clearError();

        const name = nameInput.value.trim();
        const day = Number(daySelect.value);
        const start = startSelect.value;
        const end = endSelect.value;
        const place = placeInput.value.trim();
        const teacher = teacherInput.value.trim();
        const duration = timeToMinutes(end) - timeToMinutes(start);

        if (!name) {
          showError("先给课程起个名字吧");
          nameInput.focus();
          return;
        }
        if (duration < MIN_DURATION || end <= start) {
          showError("下课时间需要比上课时间晚至少 45 分钟");
          return;
        }

        const payload = {
          name,
          day,
          weekRule: weekRuleSelect.value,
          tag: tagSelect.value,
          start,
          end,
          place,
          teacher,
          color: selectedColor()
        };

        if (editingId) {
          const index = courses.findIndex((course) => course.id === editingId);
          if (index !== -1) {
            courses[index] = { ...courses[index], ...payload };
          }
        } else {
          payload.id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
          courses.push(payload);
        }

        courses.sort((a, b) => a.day - b.day || timeToMinutes(a.start) - timeToMinutes(b.start));
        saveCourses();
        render();
        closeDialog();
      });

      deleteBtn.addEventListener("click", () => {
        courses = courses.filter((course) => course.id !== editingId);
        saveCourses();
        render();
        closeDialog();
      });

      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) closeDialog();
      });

      dialog.addEventListener("cancel", () => {
        editingId = null;
      });

      document.querySelectorAll("[data-close-dialog]").forEach((button) => {
        button.addEventListener("click", closeDialog);
      });

      $("#addBtn").addEventListener("click", () => openDialog(null));
      startSelect.addEventListener("change", onStartChange);
      moodOptions.addEventListener("click", (event) => {
        const button = event.target.closest("[data-mood]");
        if (!button || button.disabled) return;
        const course = courses.find((item) => String(item.id) === String(editingId));
        if (!course) return;
        const mood = button.dataset.mood;
        setCourseMood(course, mood);
        moodOptions.querySelectorAll(".mood-btn").forEach((item) => {
          item.classList.toggle("is-selected", item.dataset.mood === mood);
        });
        moodHint.textContent = `已记录：${MOOD_BY_VALUE[mood].label}`;
      });
      saveHeatmapBtn.addEventListener("click", downloadHeatmap);

      $("#importBtn").addEventListener("click", () => openImportDialog("mine"));
      $("#importFriendBtn").addEventListener("click", () => openImportDialog("friend"));
      $("#clearFriendBtn").addEventListener("click", () => {
        friendCourses = [];
        saveFriendCourses();
        render();
      });
      compareNowBtn.addEventListener("click", renderCompare);
      fileInput.addEventListener("change", () => handleImportFile(fileInput.files[0]));
      dropzone.addEventListener("dragenter", (event) => {
        event.preventDefault();
        dropzone.classList.add("is-dragover");
      });
      dropzone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropzone.classList.add("is-dragover");
      });
      dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("is-dragover");
      });
      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropzone.classList.remove("is-dragover");
        handleImportFile(event.dataTransfer.files[0]);
      });
      document.querySelectorAll("[data-close-import]").forEach((button) => {
        button.addEventListener("click", closeImportDialog);
      });
      importDialog.addEventListener("click", (event) => {
        if (event.target === importDialog) closeImportDialog();
      });
      confirmImport.addEventListener("click", applyPendingImport);
      Object.values(mappingSelects).forEach((select) => {
        select.addEventListener("change", () => {
          if (importMatrixInfo || importHeaderIndex < 0 || !importDataRows.length) return;
          const headers = importGrid[importHeaderIndex] || [];
          const result = parseListRows(headers, importDataRows, readListMappings());
          renderImportResult(result);
        });
      });

      document.querySelectorAll("[data-schedule-view]").forEach((button) => {
        button.addEventListener("click", () => {
          viewMode = button.dataset.scheduleView;
          localStorage.setItem(VIEW_KEY, viewMode);
          applyViewMode();
        });
      });

      agendaDays.addEventListener("click", (event) => {
        const dayButton = event.target.closest("[data-agenda-day]");
        if (!dayButton) return;
        agendaDay = Number(dayButton.dataset.agendaDay);
        renderAgenda();
      });

      timelineTrack.addEventListener("click", (event) => {
        const courseButton = event.target.closest(".timeline-course");
        if (!courseButton) return;
        const course = courses.find((item) => String(item.id) === String(courseButton.dataset.id));
        if (course) openDialog(course);
      });

      $("#commuteSettingsBtn").addEventListener("click", openCommuteDialog);
      $("#saveCommuteBtn").addEventListener("click", saveCommuteDialog);
      $("#resetCommuteBtn").addEventListener("click", resetCommuteSetting);
      document.querySelectorAll("[data-close-commute]").forEach((button) => {
        button.addEventListener("click", closeCommuteDialog);
      });
      commuteDialog.addEventListener("click", (event) => {
        if (event.target === commuteDialog) closeCommuteDialog();
      });
      commuteDialog.addEventListener("cancel", () => {});

      $("#backgroundBtn").addEventListener("click", openBackgroundDialog);
      backgroundFile.addEventListener("change", () => handleBackgroundFile(backgroundFile.files[0]));
      backgroundPresets.addEventListener("click", (event) => {
        const option = event.target.closest("[data-background-preset]");
        if (option) chooseBackgroundPreset(option.dataset.backgroundPreset);
      });
      $("#resetBackgroundBtn").addEventListener("click", () => {
        chooseBackgroundPreset("default");
        closeBackgroundDialog();
      });
      document.querySelectorAll("[data-close-background]").forEach((button) => {
        button.addEventListener("click", closeBackgroundDialog);
      });
      backgroundDialog.addEventListener("click", (event) => {
        if (event.target === backgroundDialog) closeBackgroundDialog();
      });
      backgroundDialog.addEventListener("cancel", () => {
        backgroundFile.value = "";
      });

      render();
      setInterval(() => {
        const attendanceChanged = syncAttendance();
        if (attendanceChanged) {
          renderSchedule();
          renderAgenda();
          renderStats();
        } else if (viewMode === "time") {
          renderAgenda();
        } else {
          updateNowLine();
        }
      }, 60 * 1000);

      setInterval(renderCommute, 15 * 1000);

      window.addEventListener("storage", (event) => {
        if (event.key === STORAGE_KEY) {
          courses = loadCourses();
          render();
        }
        if (event.key === FRIEND_STORAGE_KEY) {
          friendCourses = loadFriendCourses();
          render();
        }
        if (event.key === COMMUTE_KEY) {
          commuteSetting = loadCommuteSetting();
          render();
        }
      });

      buildFormOptions();
    })();
  </script>
</body>
</html>
