<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>粽子课表</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20d%3D%22M32%207C43%2015%2054%2032%2058%2048H6C10%2032%2021%2015%2032%207Z%22%20fill%3D%22%23cdefa4%22%2F%3E%3Cpath%20d%3D%22M32%207C43%2015%2054%2032%2058%2048H6C10%2032%2021%2015%2032%207Z%22%20fill%3D%22none%22%20stroke%3D%22%2358a04e%22%20stroke-width%3D%223%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M32%207L12%2048M32%207L52%2048%22%20stroke%3D%22%2394c966%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20opacity%3D%220.75%22%2F%3E%3Cpath%20d%3D%22M6%2048C17%2058%2047%2058%2058%2048L54%2056C43%2063%2021%2063%2010%2056Z%22%20fill%3D%22%2363a84e%22%2F%3E%3Cpath%20d%3D%22M6%2048C17%2058%2047%2058%2058%2048%22%20fill%3D%22none%22%20stroke%3D%22%237fb75d%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2230%22%20r%3D%226%22%20fill%3D%22%2328491f%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2230%22%20r%3D%226%22%20fill%3D%22%2328491f%22%2F%3E%3Ccircle%20cx%3D%2226%22%20cy%3D%2228%22%20r%3D%222%22%20fill%3D%22%23ffffff%22%2F%3E%3Ccircle%20cx%3D%2242%22%20cy%3D%2228%22%20r%3D%222%22%20fill%3D%22%23ffffff%22%2F%3E%3Cellipse%20cx%3D%2217%22%20cy%3D%2237%22%20rx%3D%224.5%22%20ry%3D%223%22%20fill%3D%22%23ffc5d3%22%20opacity%3D%220.95%22%2F%3E%3Cellipse%20cx%3D%2247%22%20cy%3D%2237%22%20rx%3D%224.5%22%20ry%3D%223%22%20fill%3D%22%23ffc5d3%22%20opacity%3D%220.95%22%2F%3E%3Cpath%20d%3D%22M27%2038Q32%2045%2037%2038%22%20fill%3D%22none%22%20stroke%3D%22%2328491f%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M21%2025Q32%2020%2043%2025%22%20fill%3D%22none%22%20stroke%3D%22%23f6efd1%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <style>
    :root {
      --bg: #f7f8fd;
      --surface: #ffffff;
      --ink: #3d3c52;
      --muted: #9291a5;
      --line: #ecebf3;
      --line-soft: #f3f2f8;
      --accent: #f29eb3;
      --accent-deep: #e4718d;
      --radius-small: 14px;
      --radius-medium: 20px;
      --radius-large: 26px;
      --radius-card: 18px;
      --hour-height: 52px;
      --grid-height: 728px;
      --gutter: 64px;
      --day-min: 134px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "MiSans", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      color: inherit;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1560px;
      margin: 0 auto;
      padding: 22px clamp(12px, 2.6vw, 36px) 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 4px 2px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      display: grid;
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid #e2ecd1;
      border-radius: 50%;
      background: linear-gradient(135deg, #fffdf2, #f7ffe1);
      color: #4b8f3d;
      box-shadow: 0 6px 16px rgba(112, 137, 78, 0.1);
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 800;
    }

    .today-caption {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .week-summary {
      display: flex;
      gap: 18px;
      padding-right: 4px;
    }

    .summary-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .summary-item b {
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
    }

    .commute-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 0 14px;
      padding: 12px 14px;
      border: 1px solid rgba(226, 224, 238, 0.9);
      border-radius: var(--radius-large);
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(82, 78, 120, 0.06);
    }

    .commute-banner.is-leave {
      border-color: #ffd0bc;
      background: linear-gradient(135deg, #fffaf4, #fff0ea);
    }

    .commute-icon {
      display: grid;
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 14px;
      background: #eef3ff;
      color: #5264c9;
    }

    .commute-banner.is-leave .commute-icon {
      background: #ffe4d6;
      color: #c05c38;
    }

    .commute-icon svg {
      width: 24px;
      height: 24px;
    }

    .commute-copy {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .commute-title {
      font-size: 13px;
      font-weight: 800;
    }

    .commute-detail {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commute-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .commute-countdown {
      font-size: 20px;
      font-weight: 800;
      white-space: nowrap;
    }

    .commute-depart {
      padding: 4px 9px;
      border-radius: 999px;
      background: #fff1c9;
      color: #95611a;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .commute-route-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .commute-route-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
    }

    .commute-route-row > span {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commute-route-row input {
      width: 100%;
    }

    @media (max-width: 680px) {
      .commute-banner {
        flex-direction: column;
        align-items: flex-start;
      }

      .commute-meta {
        width: 100%;
        margin-left: 0;
        justify-content: space-between;
      }

      .commute-route-row {
        grid-template-columns: 1fr;
      }
    }

    .schedule-panel {
      overflow: hidden;
      border: 1px solid rgba(227, 225, 237, 0.9);
      border-radius: var(--radius-large);
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(82, 78, 120, 0.07);
    }

    .schedule-scroll {
      overflow: auto;
      max-height: calc(100vh - 178px);
      scrollbar-color: #d9d7e7 transparent;
      scrollbar-width: thin;
    }

    .day-header-row {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      width: max-content;
      min-width: 100%;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }

    .corner-cell {
      position: sticky;
      left: 0;
      z-index: 9;
      display: flex;
      flex: 0 0 var(--gutter);
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 11px;
    }

    .day-head {
      display: flex;
      flex: 1 0 var(--day-min);
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 64px;
      border-left: 1px solid transparent;
      background: #fff;
    }

    .day-head + .day-head {
      border-left-color: var(--line);
    }

    .day-head.is-today {
      background: #fff9ed;
    }

    .day-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 800;
    }

    .day-date {
      color: var(--muted);
      font-size: 11px;
    }

    .today-tag {
      display: none;
      margin-left: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #ffe1a8;
      color: #9a6210;
      font-size: 10px;
      font-weight: 700;
    }

    .day-head.is-today .today-tag {
      display: inline-block;
    }

    .schedule-body {
      position: relative;
      display: flex;
      width: max-content;
      min-width: 100%;
      height: var(--grid-height);
    }

    .time-axis {
      position: sticky;
      left: 0;
      z-index: 4;
      flex: 0 0 var(--gutter);
      height: var(--grid-height);
      border-right: 1px solid var(--line);
      background: #fff;
    }

    .time-label {
      position: absolute;
      left: 8px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }

    .day-column {
      position: relative;
      flex: 1 0 var(--day-min);
      min-width: 0;
      height: var(--grid-height);
      overflow: hidden;
      border-left: 1px solid transparent;
      background: #fff;
    }

    .day-column + .day-column {
      border-left-color: var(--line);
    }

    .day-column.is-today {
      background: #fffaf0;
    }

    .grid-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0 calc(var(--hour-height) - 1px),
          rgba(102, 99, 131, 0.13) calc(var(--hour-height) - 1px) var(--hour-height)
        ),
        repeating-linear-gradient(
          to bottom,
          transparent 0 calc(var(--hour-height) / 2 - 1px),
          rgba(102, 99, 131, 0.05) calc(var(--hour-height) / 2 - 1px) var(--hour-height)
        );
    }

    .course-card {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      overflow: hidden;
      padding: 5px 7px;
      border: 1px solid;
      border-radius: calc(var(--radius-card) + 2px);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(76, 73, 109, 0.06);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .course-card:hover {
      z-index: 6;
      transform: translateY(-1px);
      box-shadow: 0 7px 14px rgba(76, 73, 109, 0.14);
    }

    .course-card:focus-visible {
      z-index: 6;
      outline: 2px solid #7e72e8;
      outline-offset: 2px;
    }

    .attendance-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 1;
      display: grid;
      width: 13px;
      height: 13px;
      place-items: center;
      border-radius: 50%;
      background: #4bbf79;
      color: #fff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
    }

    .attendance-badge svg {
      width: 8px;
      height: 8px;
    }

    .mood-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 1;
      display: grid;
      width: 16px;
      height: 16px;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 0 1px rgba(80, 76, 108, 0.08);
      font-size: 11px;
      line-height: 1;
    }

    .timeline-course .mood-badge {
      width: 22px;
      height: 22px;
      font-size: 15px;
    }

    .course-card.has-mood .course-title,
    .timeline-course.has-mood .course-title {
      padding-left: 22px;
    }

    .course-card.is-live::after {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      background: #ff9b3d;
      box-shadow: 0 0 0 1px rgba(216, 120, 24, 0.4);
      content: "";
    }

    .course-time {
      display: block;
      max-width: 100%;
      overflow: hidden;
      padding-right: 16px;
      color: rgba(56, 58, 72, 0.72);
      font-size: 10px;
      line-height: 1.1;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .course-title {
      display: -webkit-box;
      overflow: hidden;
      margin: 3px 0 0;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow-wrap: anywhere;
    }

    .course-meta {
      display: flex;
      align-items: center;
      gap: 3px;
      max-width: 100%;
      min-height: 0;
      margin-top: auto;
      padding-top: 4px;
      overflow: hidden;
      color: rgba(56, 58, 72, 0.68);
      font-size: 10px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .course-meta span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .course-meta svg {
      flex: 0 0 auto;
      width: 11px;
      height: 11px;
    }

    .course-tag {
      display: inline-flex;
      max-width: 100%;
      align-items: center;
      margin-top: 4px;
      padding: 2px 6px;
      overflow: hidden;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 800;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timeline-course .course-tag {
      margin-top: 6px;
      padding: 3px 8px;
      font-size: 10px;
    }

    .course-tag.t-easy {
      background: #e0f7e8;
      color: #2f7d52;
    }

    .course-tag.t-hard {
      background: #ffe7df;
      color: #c3513d;
    }

    .course-tag.t-lab {
      background: #e6ecff;
      color: #4a66d6;
    }

    .course-card.is-compact .course-meta {
      display: none;
    }

    .course-card.is-compact .course-tag,
    .course-card.is-tiny .course-tag {
      display: none;
    }

    .course-card.is-compact .course-title {
      font-size: 12px;
      -webkit-line-clamp: 1;
    }

    .course-card.is-tiny .course-time {
      display: none;
    }

    .course-card.is-tiny .course-title {
      margin: 0;
      font-size: 11px;
      -webkit-line-clamp: 1;
    }

    .course-card.c-mint,
    .timeline-course.c-mint {
      border-color: rgba(117, 203, 145, 0.56);
      background: linear-gradient(135deg, rgba(226, 247, 236, 0.82), rgba(239, 255, 246, 0.58));
    }

    .course-card.c-peach,
    .timeline-course.c-peach {
      border-color: rgba(239, 166, 120, 0.62);
      background: linear-gradient(135deg, rgba(255, 235, 222, 0.86), rgba(255, 246, 239, 0.58));
    }

    .course-card.c-sky,
    .timeline-course.c-sky {
      border-color: rgba(124, 184, 237, 0.62);
      background: linear-gradient(135deg, rgba(228, 242, 254, 0.88), rgba(243, 251, 255, 0.58));
    }

    .course-card.c-lemon,
    .timeline-course.c-lemon {
      border-color: rgba(229, 197, 105, 0.66);
      background: linear-gradient(135deg, rgba(255, 244, 204, 0.86), rgba(255, 252, 235, 0.58));
    }

    .course-card.c-lilac,
    .timeline-course.c-lilac {
      border-color: rgba(165, 145, 226, 0.62);
      background: linear-gradient(135deg, rgba(239, 233, 253, 0.88), rgba(250, 247, 255, 0.58));
    }

    .course-card.c-rose,
    .timeline-course.c-rose {
      border-color: rgba(237, 145, 172, 0.62);
      background: linear-gradient(135deg, rgba(254, 230, 238, 0.86), rgba(255, 247, 250, 0.58));
    }

    .now-line {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 5;
      height: 2px;
      background: #ff587f;
      pointer-events: none;
    }

    .now-line::before {
      position: absolute;
      top: -4px;
      left: -3px;
      width: 10px;
      height: 10px;
      border: 2px solid #ff587f;
      border-radius: 50%;
      background: #fff;
      content: "";
    }

    .empty-note {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      display: none;
      transform: translate(-50%, -50%);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .empty-note svg {
      display: block;
      width: 34px;
      height: 34px;
      margin: 0 auto 8px;
      opacity: 0.55;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 14px rgba(242, 158, 179, 0.24);
    }

    .btn-primary:hover {
      border-color: var(--accent-deep);
      background: var(--accent-deep);
    }

    .btn-ghost {
      border-color: #e5e3ef;
      background: #fff;
      color: #66647d;
    }

    .btn-ghost:hover {
      border-color: #d6d3e5;
      background: #fafaff;
    }

    .btn-danger {
      border-color: #f5c6d0;
      background: #fff0f3;
      color: #d54d68;
    }

    .btn-danger:hover {
      border-color: #ef9caf;
      background: #ffe7ec;
    }

    .icon-btn {
      width: 36px;
      min-width: 36px;
      padding: 0;
      border-radius: 50%;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .dialog {
      width: min(580px, calc(100vw - 22px));
      max-height: calc(100vh - 32px);
      overflow: hidden;
      padding: 0;
      border: 1px solid #e9e7f1;
      border-radius: var(--radius-large);
      background: #fff;
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(55, 51, 90, 0.24);
    }

    .dialog::backdrop {
      background: rgba(54, 51, 82, 0.3);
      backdrop-filter: blur(3px);
    }

    .dialog-inner {
      display: flex;
      max-height: calc(100vh - 32px);
      flex-direction: column;
      padding: 20px 22px 22px;
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .dialog-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
    }

    .dialog-sub {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .form-scroll {
      overflow: auto;
      padding-right: 2px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 13px;
    }

    .field {
      display: block;
      min-width: 0;
    }

    .field-wide {
      grid-column: 1 / -1;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      color: #6c6a83;
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #dedceb;
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
    }

    .field select {
      appearance: auto;
    }

    .field input:focus,
    .field select:focus {
      border-color: #9f95ed;
      box-shadow: 0 0 0 3px rgba(139, 129, 235, 0.15);
    }

    .color-field {
      padding: 0;
      border: 0;
      margin: 0;
    }

    .color-field legend {
      margin-bottom: 8px;
      padding: 0;
      color: #6c6a83;
      font-size: 12px;
      font-weight: 700;
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .mood-field {
      grid-column: 1 / -1;
    }

    .mood-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mood-btn {
      display: inline-flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid #e3e1ed;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      font-size: 20px;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .mood-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #fff8fa;
      transform: translateY(-1px);
    }

    .mood-btn.is-selected {
      border-color: var(--accent);
      background: #fff0f4;
      box-shadow: 0 0 0 3px rgba(242, 158, 179, 0.16);
    }

    .mood-btn:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .mood-hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .swatch {
      position: relative;
      display: block;
      cursor: pointer;
    }

    .swatch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .swatch-dot {
      display: block;
      width: 27px;
      height: 27px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(75, 72, 109, 0.16);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .swatch input:checked + .swatch-dot {
      box-shadow: 0 0 0 2px #56536d, 0 0 0 4px #fff;
      transform: scale(1.05);
    }

    .swatch:hover .swatch-dot {
      transform: scale(1.08);
    }

    .sw-mint .swatch-dot {
      background: #9edcb9;
    }

    .sw-peach .swatch-dot {
      background: #f9b98f;
    }

    .sw-sky .swatch-dot {
      background: #9acdf3;
    }

    .sw-lemon .swatch-dot {
      background: #f1d56e;
    }

    .sw-lilac .swatch-dot {
      background: #b8a5ed;
    }

    .sw-rose .swatch-dot {
      background: #f39bb7;
    }

    .form-error {
      display: none;
      margin: 13px 0 0;
      padding: 9px 11px;
      border-radius: var(--radius-small);
      background: #fff0f2;
      color: #c94661;
      font-size: 12px;
      line-height: 1.4;
    }

    .form-error.visible {
      display: block;
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 18px;
    }

    .form-actions .spacer {
      flex: 1;
    }

    .import-dialog {
      width: min(820px, calc(100vw - 22px));
    }

    .dropzone {
      display: grid;
      min-height: 148px;
      place-items: center;
      padding: 18px;
      border: 1.5px dashed #d3d0e5;
      border-radius: 22px;
      background: #fbfaff;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .dropzone:hover,
    .dropzone.is-dragover {
      border-color: var(--accent);
      background: #fff7f9;
    }

    .upload-icon {
      display: grid;
      width: 40px;
      height: 40px;
      margin-bottom: 10px;
      place-items: center;
      border-radius: 50%;
      background: #fff0f4;
      color: var(--accent-deep);
    }

    .upload-icon svg {
      width: 20px;
      height: 20px;
    }

    .upload-title {
      display: block;
      color: #55536b;
      font-size: 14px;
      font-weight: 800;
    }

    .upload-types {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .import-state {
      margin-top: 13px;
      padding: 11px 13px;
      border-left: 3px solid #85cfa6;
      border-radius: var(--radius-small);
      background: #f1faf5;
      color: #47755b;
      font-size: 13px;
      line-height: 1.5;
    }

    .import-state b {
      color: #2e6548;
    }

    .section-title {
      margin: 16px 0 9px;
      color: #55536b;
      font-size: 13px;
      font-weight: 800;
    }

    .mapping-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .map-field {
      display: block;
      min-width: 0;
    }

    .map-field span {
      display: block;
      margin-bottom: 5px;
      color: #6c6a83;
      font-size: 11px;
      font-weight: 700;
    }

    .map-field select {
      width: 100%;
      height: 34px;
      padding: 0 8px;
      border: 1px solid #dedceb;
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
    }

    .map-field select:focus {
      border-color: #9f95ed;
      box-shadow: 0 0 0 3px rgba(139, 129, 235, 0.15);
    }

    .import-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0 0;
      padding: 0;
      border: 0;
    }

    .import-mode legend {
      width: 100%;
      margin-bottom: 7px;
      padding: 0;
      color: #6c6a83;
      font-size: 11px;
      font-weight: 700;
    }

    .mode-chip {
      position: relative;
      cursor: pointer;
    }

    .mode-chip input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .mode-chip span {
      display: inline-flex;
      min-height: 32px;
      align-items: center;
      padding: 0 13px;
      border: 1px solid #e0deeb;
      border-radius: 14px;
      background: #fff;
      color: #67647e;
      font-size: 12px;
      font-weight: 700;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .mode-chip input:checked + span {
      border-color: #f7a0b6;
      background: #fff0f4;
      color: #c94d6b;
    }

    .preview-box {
      max-height: 250px;
      overflow: auto;
      border: 1px solid #e7e5ef;
      border-radius: var(--radius-medium);
      scrollbar-color: #d9d7e7 transparent;
      scrollbar-width: thin;
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .preview-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 8px 10px;
      border-bottom: 1px solid #e4e2ee;
      background: #fbfaff;
      color: #747188;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }

    .preview-table td {
      max-width: 260px;
      padding: 7px 10px;
      border-bottom: 1px solid #f0eef6;
      overflow: hidden;
      color: #55536b;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-table tr:last-child td {
      border-bottom: 0;
    }

    .preview-table .preview-day {
      color: #95542e;
      font-weight: 700;
    }

    .preview-table .preview-time {
      color: #3e7d8c;
      font-variant-numeric: tabular-nums;
    }

    body.has-custom-bg {
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    body.has-custom-bg::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: rgba(255, 255, 255, 0.2);
      content: "";
      pointer-events: none;
    }

    .schedule-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(230, 228, 240, 0.9);
      background: rgba(255, 255, 255, 0.56);
      backdrop-filter: blur(12px);
    }

    .view-tabs {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border-radius: 16px;
      background: rgba(236, 234, 246, 0.8);
    }

    .view-tab {
      padding: 7px 14px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: #6f6c86;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .view-tab.is-active {
      background: rgba(255, 255, 255, 0.96);
      color: #4d4a68;
      box-shadow: 0 3px 10px rgba(74, 70, 110, 0.12);
    }

    .has-custom-bg .schedule-panel {
      background: rgba(255, 255, 255, 0.38);
      border-color: rgba(255, 255, 255, 0.58);
      box-shadow: 0 12px 36px rgba(60, 56, 95, 0.14);
    }

    .has-custom-bg .schedule-panel-head,
    .has-custom-bg .day-header-row {
      background: rgba(255, 255, 255, 0.44);
      border-bottom-color: rgba(255, 255, 255, 0.58);
    }

    .has-custom-bg .day-head,
    .has-custom-bg .corner-cell,
    .has-custom-bg .time-axis {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.36);
    }

    .has-custom-bg .day-head.is-today {
      background: rgba(255, 241, 201, 0.42);
    }

    .has-custom-bg .day-column {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .has-custom-bg .day-column.is-today {
      background: rgba(255, 245, 218, 0.26);
    }

    .course-card {
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .agenda-view {
      padding: 16px clamp(12px, 2vw, 22px) 26px;
    }

    .agenda-days {
      position: sticky;
      top: 0;
      z-index: 7;
      display: flex;
      gap: 8px;
      margin: -2px -2px 16px;
      padding: 8px 2px 10px;
      overflow-x: auto;
      border-radius: var(--radius-medium);
      background: rgba(255, 255, 255, 0.58);
      scrollbar-width: none;
      backdrop-filter: blur(10px);
    }

    .agenda-days::-webkit-scrollbar {
      display: none;
    }

    .agenda-day {
      display: flex;
      flex: 0 0 auto;
      min-width: 76px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 12px;
      border: 1px solid rgba(223, 221, 237, 0.86);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.58);
      color: #66647d;
      cursor: pointer;
    }

    .agenda-day b {
      font-size: 13px;
      line-height: 1.2;
    }

    .agenda-day small {
      color: #9997ad;
      font-size: 10px;
    }

    .agenda-day.is-today {
      border-color: #ffcfdb;
      background: #fff1f4;
      color: #d64e6e;
    }

    .agenda-day.is-active {
      border-color: #9e94df;
      background: rgba(243, 240, 255, 0.92);
      color: #5a4cbd;
      box-shadow: 0 4px 12px rgba(108, 93, 211, 0.18);
    }

    .heatmap-view {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px clamp(12px, 2vw, 22px) 26px;
    }

    .heatmap-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .heatmap-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .heatmap-range {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .heatmap-scroll {
      min-width: 0;
      overflow: auto;
      padding-bottom: 6px;
      scrollbar-color: #d9d7e7 transparent;
      scrollbar-width: thin;
    }

    .heatmap-grid {
      display: grid;
      gap: 10px;
      min-width: 720px;
    }

    .heatmap-month {
      padding: 12px;
      border: 1px solid rgba(227, 225, 237, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.64);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .heatmap-month-name {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .heatmap-weekdays,
    .heatmap-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .heatmap-weekdays {
      margin-bottom: 6px;
    }

    .heatmap-weekday {
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .heatmap-day {
      min-height: 48px;
      padding: 6px;
      border-radius: 14px;
      font-size: 11px;
      line-height: 1.2;
      box-shadow: inset 0 0 0 1px rgba(80, 76, 108, 0.03);
    }

    .heatmap-day b {
      display: block;
      font-size: 12px;
    }

    .heatmap-day small {
      color: rgba(56, 58, 72, 0.7);
    }

    .heatmap-day.is-today {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .heatmap-day.empty {
      background: rgba(255, 255, 255, 0.38);
      box-shadow: none;
    }

    .load-0 {
      background: #f5f6fa;
    }

    .load-1 {
      background: #e2f3df;
    }

    .load-2 {
      background: #fff0c9;
    }

    .load-3 {
      background: #ffd3ae;
    }

    .load-4 {
      background: #ff9db0;
    }

    .heatmap-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-chip span {
      display: block;
      width: 16px;
      height: 16px;
      border-radius: 6px;
      box-shadow: inset 0 0 0 1px rgba(80, 76, 108, 0.06);
    }

    .has-custom-bg .heatmap-month {
      background: rgba(255, 255, 255, 0.36);
      border-color: rgba(255, 255, 255, 0.44);
    }

    .compare-view {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px clamp(12px, 2vw, 22px) 26px;
    }

    .compare-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .compare-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .compare-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .compare-stat {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 5px;
      padding: 10px 12px;
      border: 1px solid rgba(227, 225, 237, 0.9);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.64);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .compare-stat b {
      font-size: 20px;
      line-height: 1;
    }

    .compare-stat span {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .has-custom-bg .compare-stat {
      background: rgba(255, 255, 255, 0.36);
      border-color: rgba(255, 255, 255, 0.44);
    }

    .compare-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .free-slot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(223, 221, 237, 0.86);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.64);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 5px 14px rgba(65, 61, 98, 0.06);
    }

    .free-slot-day {
      flex: 0 0 58px;
      font-size: 13px;
      font-weight: 800;
    }

    .free-slot-time {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 800;
    }

    .free-slot-duration {
      flex: 0 0 auto;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef3ff;
      color: #5264c9;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .compare-empty {
      margin: 0;
      padding: 18px;
      border: 1px dashed #d3d0e5;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.5);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .has-custom-bg .compare-empty {
      background: rgba(255, 255, 255, 0.36);
      border-color: rgba(255, 255, 255, 0.44);
    }

    @media (max-width: 560px) {
      .compare-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .free-slot {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .free-slot-duration {
        align-self: flex-start;
      }
    }

    .day-timeline {
      position: relative;
      display: flex;
      height: 840px;
      min-height: 840px;
      overflow: hidden;
      border: 1px solid rgba(227, 225, 237, 0.75);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .timeline-axis {
      position: relative;
      flex: 0 0 72px;
      height: 840px;
      border-right: 1px solid rgba(218, 215, 231, 0.9);
      background: rgba(255, 255, 255, 0.66);
    }

    .timeline-time {
      position: absolute;
      right: 10px;
      color: #7e7b94;
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }

    .timeline-track {
      position: relative;
      flex: 1;
      height: 840px;
      min-width: 0;
      overflow: hidden;
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0 59px,
          rgba(104, 102, 138, 0.13) 59px 60px
        ),
        repeating-linear-gradient(
          to bottom,
          transparent 0 29px,
          rgba(104, 102, 138, 0.05) 29px 30px
        );
    }

    .timeline-course {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      overflow: hidden;
      padding: 9px 13px;
      border: 1px solid;
      border-radius: 18px;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(65, 61, 98, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .timeline-course:hover {
      z-index: 5;
      transform: translateX(2px);
      box-shadow: 0 8px 18px rgba(65, 61, 98, 0.16);
    }

    .timeline-course .course-time {
      max-width: 100%;
      font-size: 11px;
    }

    .timeline-course .course-title {
      margin-top: 5px;
      font-size: 15px;
      -webkit-line-clamp: 3;
    }

    .timeline-course .course-meta {
      font-size: 11px;
    }

    .timeline-now {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 4;
      height: 2px;
      background: #f27e9d;
      pointer-events: none;
    }

    .timeline-now::before {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 10px;
      height: 10px;
      border: 2px solid #f27e9d;
      border-radius: 50%;
      background: #fff;
      content: "";
    }

    .timeline-empty {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #8e8ba3;
      font-size: 13px;
    }

    .has-custom-bg .day-timeline {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.44);
    }

    .has-custom-bg .timeline-axis {
      background: rgba(255, 255, 255, 0.22);
    }

    .background-presets {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .bg-option {
      display: flex;
      min-height: 86px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 6px;
      border: 1px solid #e3e1ed;
      border-radius: 18px;
      background: #fff;
      color: #6b6882;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .bg-option span {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(76, 72, 111, 0.18);
    }

    .bg-option.is-selected {
      border-color: #f39bb1;
      background: #fff3f6;
      color: #c94d6b;
      box-shadow: 0 0 0 2px rgba(255, 127, 158, 0.14);
    }

    .background-upload {
      display: flex;
      min-height: 74px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 14px;
      border: 1.5px dashed #d2cfe4;
      border-radius: 18px;
      background: #fbfaff;
      color: #6d6a86;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .background-upload:hover {
      border-color: #f39bb1;
      background: #fff5f8;
    }

    .background-upload svg {
      width: 18px;
      height: 18px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 720px) {
      .app {
        padding-top: 14px;
      }

      .topbar {
        padding-bottom: 12px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
      }

      .brand h1 {
        font-size: 19px;
      }

      .week-summary {
        display: none;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions .btn {
        flex: 1;
      }

      .top-actions .btn-primary {
        margin-left: 0;
      }

      .schedule-panel {
        border-radius: 20px;
      }

      .timeline-axis {
        flex-basis: 58px;
      }

      .timeline-course {
        padding: 7px 9px;
      }

      .timeline-course .course-title {
        font-size: 13px;
      }

      .timeline-course .course-meta {
        font-size: 10px;
      }

      .background-presets {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .schedule-scroll {
        max-height: calc(100vh - 188px);
      }

      .fields {
        grid-template-columns: 1fr;
      }

      .mapping-grid {
        grid-template-columns: 1fr 1fr;
      }

      .field-wide {
        grid-column: auto;
      }
    }

    @media (max-width: 430px) {
      .mapping-grid {
        grid-template-columns: 1fr;
      }

      .mode-chip {
        flex: 1;
      }

      .mode-chip span {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M32 7C43 15 54 32 58 48H6C10 32 21 15 32 7Z" fill="#cdefa4"></path>
            <path d="M32 7C43 15 54 32 58 48H6C10 32 21 15 32 7Z" fill="none" stroke="#58a04e" stroke-width="3" stroke-linejoin="round"></path>
            <path d="M32 7L12 48M32 7L52 48" stroke="#94c966" stroke-width="3" stroke-linecap="round" opacity="0.75"></path>
            <path d="M6 48C17 58 47 58 58 48L54 56C43 63 21 63 10 56Z" fill="#63a84e"></path>
            <path d="M6 48C17 58 47 58 58 48" fill="none" stroke="#7fb75d" stroke-width="2" stroke-linecap="round"></path>
            <circle cx="24" cy="30" r="6" fill="#28491f"></circle>
            <circle cx="40" cy="30" r="6" fill="#28491f"></circle>
            <circle cx="26" cy="28" r="2" fill="#ffffff"></circle>
            <circle cx="42" cy="28" r="2" fill="#ffffff"></circle>
            <ellipse cx="17" cy="37" rx="4.5" ry="3" fill="#ffc5d3" opacity="0.95"></ellipse>
            <ellipse cx="47" cy="37" rx="4.5" ry="3" fill="#ffc5d3" opacity="0.95"></ellipse>
            <path d="M27 38Q32 45 37 38" fill="none" stroke="#28491f" stroke-width="2.6" stroke-linecap="round"></path>
            <path d="M21 25Q32 20 43 25" fill="none" stroke="#f6efd1" stroke-width="3.5" stroke-linecap="round"></path>
          </svg>
        </span>
        <div>
          <h1>粽子课表</h1>
          <p class="today-caption" id="todayCaption"></p>
        </div>
      </div>
      <div class="top-actions">
        <div class="week-summary" aria-label="课表概览">
          <div class="summary-item"><span>本周课程</span><b id="courseCount">0</b><span>门</span></div>
          <div class="summary-item"><span>今日</span><b id="todayCount">0</b><span>节</span></div>
          <div class="summary-item"><span>今日打卡</span><b id="todayDoneCount">0</b><span>/ <b id="todayTotalCount">0</b> 节</span></div>
        </div>
        <button class="btn btn-ghost icon-btn" id="commuteSettingsBtn" type="button" title="通勤设置" aria-label="通勤设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 10c0 4.7-8 11-8 11s-8-6.3-8-11a8 8 0 0 1 16 0Z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </button>
        <button class="btn btn-ghost" id="importBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <path d="m7 8 5-5 5 5"></path>
            <path d="M12 3v12"></path>
          </svg>
          导入
        </button>
        <button class="btn btn-primary" id="addBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="M12 5v14"></path>
          </svg>
          添加课程
        </button>
      </div>
    </header>

    <section class="commute-banner" id="commuteBar" aria-label="课前通勤倒计时" hidden>
      <div class="commute-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"></path>
        </svg>
      </div>
      <div class="commute-copy">
        <strong class="commute-title" id="commuteTitle">下一门课</strong>
        <span class="commute-detail" id="commuteDetail"></span>
      </div>
      <div class="commute-meta">
        <span class="commute-countdown" id="commuteCountdown"></span>
        <span class="commute-depart" id="commuteDepart"></span>
      </div>
    </section>

    <section class="schedule-panel" aria-label="课表">
      <div class="schedule-panel-head">
        <div class="view-tabs" role="group" aria-label="课表视图">
          <button class="view-tab is-active" type="button" data-schedule-view="time">时间条</button>
          <button class="view-tab" type="button" data-schedule-view="grid">周课表</button>
          <button class="view-tab" type="button" data-schedule-view="heatmap">热力图</button>
          <button class="view-tab" type="button" data-schedule-view="compare">拼表</button>
        </div>
        <button class="btn btn-ghost icon-btn" id="backgroundBtn" type="button" title="自定义背景" aria-label="自定义背景">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="9" cy="9" r="2"></circle>
            <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path>
          </svg>
        </button>
      </div>
      <div class="schedule-scroll">
        <div id="gridView">
          <div class="day-header-row" id="dayHeaderRow"></div>
          <div class="schedule-body" id="scheduleBody"></div>
        </div>
        <div class="agenda-view" id="agendaView" hidden>
          <div class="agenda-days" id="agendaDays"></div>
          <div class="day-timeline" id="dayTimeline">
            <div class="timeline-axis" id="timelineAxis"></div>
            <div class="timeline-track" id="timelineTrack"></div>
          </div>
        </div>
        <div class="heatmap-view" id="heatmapView" hidden>
          <div class="heatmap-head">
            <div>
              <h3 class="heatmap-title">学期课程热力图</h3>
              <p class="heatmap-range" id="heatmapRange"></p>
            </div>
            <button class="btn btn-ghost" id="saveHeatmapBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <path d="M7 10l5 5 5-5"></path>
                <path d="M12 15V3"></path>
              </svg>
              保存图片
            </button>
          </div>
          <div class="heatmap-scroll">
            <div class="heatmap-grid" id="heatmapGrid"></div>
          </div>
          <div class="heatmap-legend" id="heatmapLegend"></div>
        </div>
        <div class="compare-view" id="compareView" hidden>
          <div class="compare-head">
            <div>
              <h3 class="heatmap-title">课表拼表 · 自动对比</h3>
              <p id="compareSummary" class="heatmap-range"></p>
            </div>
            <div class="compare-actions">
              <button class="btn btn-ghost" id="importFriendBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M12 15V3"></path>
                </svg>
                导入同学课表
              </button>
              <button class="btn btn-primary" id="compareNowBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.35-4.35"></path>
                </svg>
                一键找空闲
              </button>
              <button class="btn btn-ghost" id="clearFriendBtn" type="button">清空同学课表</button>
            </div>
          </div>
          <div class="compare-stats" id="compareStats"></div>
          <div class="compare-list" id="compareList"></div>
        </div>
      </div>
    </section>
  </main>

  <dialog class="dialog" id="courseDialog">
    <form class="dialog-inner" id="courseForm" novalidate>
      <div class="dialog-head">
        <div>
          <h2 class="dialog-title" id="dialogTitle">添加课程</h2>
          <p class="dialog-sub" id="dialogSub"></p>
        </div>
        <button class="btn btn-ghost icon-btn" type="button" data-close-dialog aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <div class="form-scroll">
        <div class="fields">
          <label class="field field-wide">
            <span class="field-label">课程名称</span>
            <input id="nameInput" name="name" maxlength="24" autocomplete="off">
          </label>

          <label class="field">
            <span class="field-label">星期</span>
            <select id="daySelect"></select>
          </label>

          <label class="field">
            <span class="field-label">开课周</span>
            <select id="weekRuleSelect">
              <option value="all">每周</option>
              <option value="odd">单周</option>
              <option value="even">双周</option>
              <option value="range3to12">第3-12周</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">课程标签</span>
            <select id="tagSelect">
              <option value="">无</option>
              <option value="easy">水课</option>
              <option value="hard">硬核专业课</option>
              <option value="lab">实验课</option>
            </select>
          </label>

          <fieldset class="field color-field">
            <legend class="field-label">颜色</legend>
            <div class="swatches" id="colorSwatches"></div>
          </fieldset>

          <fieldset class="field color-field mood-field">
            <legend class="field-label">课程心情打卡</legend>
            <div class="mood-options" id="moodOptions">
              <button class="mood-btn" type="button" data-mood="happy" title="开心" aria-label="开心">😄</button>
              <button class="mood-btn" type="button" data-mood="neutral" title="一般" aria-label="一般">🙂</button>
              <button class="mood-btn" type="button" data-mood="sleepy" title="困" aria-label="困">😪</button>
              <button class="mood-btn" type="button" data-mood="fired" title="冲" aria-label="冲">💪</button>
              <button class="mood-btn" type="button" data-mood="tired" title="累" aria-label="累">😫</button>
            </div>
            <p class="mood-hint" id="moodHint"></p>
          </fieldset>

          <label class="field">
            <span class="field-label">上课时间</span>
            <select id="startSelect"></select>
          </label>

          <label class="field">
            <span class="field-label">下课时间</span>
            <select id="endSelect"></select>
          </label>

          <label class="field">
            <span class="field-label">地点</span>
            <input id="placeInput" name="place" maxlength="30" autocomplete="off">
          </label>

          <label class="field">
            <span class="field-label">老师</span>
            <input id="teacherInput" name="teacher" maxlength="20" autocomplete="off">
          </label>
        </div>

        <p class="form-error" id="formError"></p>
      </div>

      <div class="form-actions">
        <button class="btn btn-danger" id="deleteBtn" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          删除
        </button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" type="button" data-close-dialog>取消</button>
        <button class="btn btn-primary" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
          保存
        </button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog import-dialog" id="importDialog">
    <div class="dialog-inner">
      <div class="dialog-head">
        <div>
          <h2 class="dialog-title">导入课表</h2>
          <p class="dialog-sub" id="importFileHint"></p>
        </div>
        <button class="btn btn-ghost icon-btn" type="button" data-close-import aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <div class="form-scroll">
        <input id="fileInput" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.pdf" hidden>
        <label class="dropzone" id="dropzone" for="fileInput">
          <span>
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <path d="m7 8 5-5 5 5"></path>
                <path d="M12 3v12"></path>
              </svg>
            </span>
            <span class="upload-title">选择或拖入课表文件</span>
            <span class="upload-types">.xlsx .xls .csv .tsv .pdf</span>
          </span>
        </label>

        <p class="form-error" id="importError"></p>
        <div class="import-state" id="importState" hidden></div>

        <div class="mapping-area" id="mappingArea" hidden>
          <div class="section-title">列设置</div>
          <div class="mapping-grid">
            <label class="map-field">
              <span>课程名称</span>
              <select id="mapCourse"></select>
            </label>
            <label class="map-field">
              <span>星期</span>
              <select id="mapDay"></select>
            </label>
            <label class="map-field">
              <span>上课时间 / 节次</span>
              <select id="mapStart"></select>
            </label>
            <label class="map-field">
              <span>下课时间</span>
              <select id="mapEnd"></select>
            </label>
            <label class="map-field">
              <span>地点</span>
              <select id="mapPlace"></select>
            </label>
            <label class="map-field">
              <span>老师</span>
              <select id="mapTeacher"></select>
            </label>
          </div>
        </div>

        <div id="previewArea" hidden>
          <div class="section-title" id="previewTitle">识别预览</div>
          <div class="preview-box">
            <table class="preview-table">
              <thead>
                <tr>
                  <th>星期</th>
                  <th>时间</th>
                  <th>课程</th>
                  <th>地点</th>
                  <th>老师</th>
                </tr>
              </thead>
              <tbody id="previewBody"></tbody>
            </table>
          </div>
        </div>

        <fieldset class="import-mode" id="importMode" hidden>
          <legend id="importModeLegend">加入方式</legend>
          <label class="mode-chip">
            <input type="radio" name="importMode" value="replace" checked>
            <span id="replaceModeLabel">替换当前课表</span>
          </label>
          <label class="mode-chip">
            <input type="radio" name="importMode" value="merge">
            <span id="mergeModeLabel">追加到现有课表</span>
          </label>
        </fieldset>
      </div>

      <div class="form-actions">
        <span class="spacer"></span>
        <button class="btn btn-ghost" type="button" data-close-import>取消</button>
        <button class="btn btn-primary" id="confirmImport" type="button" hidden>确认导入</button>
      </div>
    </div>
  </dialog>

  <dialog class="dialog" id="commuteDialog">
    <div class="dialog-inner">
      <div class="dialog-head">
        <div>
          <h2 class="dialog-title">课前通勤</h2>
          <p class="dialog-sub">记录出发点，并按教学楼设置步行时间</p>
        </div>
        <button class="btn btn-ghost icon-btn" type="button" data-close-commute aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <div class="form-scroll">
        <label class="field field-wide">
          <span class="field-label">我的出发点</span>
          <input id="commuteOriginInput" maxlength="30" autocomplete="off" placeholder="例如：宿舍 / 家 / 图书馆">
        </label>

        <label class="field">
          <span class="field-label">默认步行时间</span>
          <input id="commuteDefaultInput" type="number" min="1" max="120" step="1">
        </label>

        <label class="field">
          <span class="field-label">浏览器提前提醒</span>
          <select id="commuteNotifySelect">
            <option value="off">关闭</option>
            <option value="on">开启</option>
          </select>
        </label>

        <div class="section-title">教学楼从出发点的步行时间</div>
        <div class="commute-route-list" id="commuteRouteList"></div>

        <p class="form-error" id="commuteError"></p>
      </div>

      <div class="form-actions">
        <button class="btn btn-danger" id="resetCommuteBtn" type="button">重置默认</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" type="button" data-close-commute>取消</button>
        <button class="btn btn-primary" id="saveCommuteBtn" type="button">保存</button>
      </div>
    </div>
  </dialog>

  <dialog class="dialog" id="backgroundDialog">
    <div class="dialog-inner">
      <div class="dialog-head">
        <div>
          <h2 class="dialog-title">自定义背景</h2>
          <p class="dialog-sub"></p>
        </div>
        <button class="btn btn-ghost icon-btn" type="button" data-close-background aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <div class="form-scroll">
        <div class="section-title">背景颜色</div>
        <div class="background-presets" id="backgroundPresets"></div>

        <div class="section-title">背景图片</div>
        <input id="backgroundFile" type="file" accept="image/*" hidden>
        <label class="background-upload" id="backgroundUpload" for="backgroundFile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="9" cy="9" r="2"></circle>
            <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path>
          </svg>
          选择本地图片
        </label>
        <p class="form-error" id="backgroundError"></p>
      </div>

      <div class="form-actions">
        <button class="btn btn-danger" id="resetBackgroundBtn" type="button">恢复默认</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" type="button" data-close-background>完成</button>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      "use strict";

      const WEEKDAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
      const DAY_COLORS = ["mint", "peach", "sky", "lemon", "lilac", "rose"];
      const DAY_COLOR_LABELS = {
        mint: "薄荷",
        peach: "蜜桃",
        sky: "晴空",
        lemon: "柠檬",
        lilac: "香芋",
        rose: "蔷薇"
      };
      const MOODS = [
        { value: "happy", emoji: "😄", label: "开心" },

      function escapeHtml(value) {

      function timeToMinutes(time) {
        const [hour, minute] = time.split(":").map(Number);
        return hour * 60 + minute;
      }

      function minutesToTime(minutes) {
        const safe = Math.max(0, Math.min(minutes, 23 * 60 + 59));
        const hour = Math.floor(safe / 60);
        const minute = safe % 60;
        return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
      }

      function addMinutes(time, amount) {

      function timeOptions(from, to, step) {
        const options = [];
        let current = timeToMinutes(from);
        const last = timeToMinutes(to);
        while (current <= last) {
          const label = minutesToTime(current);
          options.push(`<option value="${label}">${label}</option>`);
          current += step;
        }
        return options.join("");
      }

      function cellText(value) {
        if (value === null || value === undefined) return "";
        if (typeof value !== "string") return String(value).trim();
        return value.replace(/\u00a0/g, " ").trim();
      }

      function detectDelimiter(text) {
        const sample = text.slice(0, 6000).split(/\r?\n/).slice(0, 25).join("\n");
        const counts = { ",": 0, "\t": 0, ";": 0 };
        for (const char of sample) {
          if (Object.prototype.hasOwnProperty.call(counts, char)) counts[char] += 1;
        }
        if (counts["\t"] > counts[","]) return "\t";
        if (counts[";"] > counts[","] && counts[";"] >= 3) return ";";
        return ",";
      }

      function parseDelimitedText(text, delimiter) {
        const rows = [];
        let row = [];
        let field = "";
        let quoted = false;
        const cleanText = text.replace(/^\uFEFF/, "");
        for (let index = 0; index < cleanText.length; index += 1) {
          const char = cleanText[index];
          if (quoted) {
            if (char === '"') {
              if (cleanText[index + 1] === '"') {
                field += '"';
                index += 1;
              } else {
                quoted = false;
              }
            } else {
              field += char;
            }
          } else if (char === '"') {
            quoted = true;
          } else if (char === delimiter) {
            row.push(field);
            field = "";
          } else if (char === "\n") {
            row.push(field);
            rows.push(row);
            row = [];
            field = "";
          } else if (char !== "\r") {
            field += char;
          }
        }
        row.push(field);
        rows.push(row);
        return rows
          .map((cells) => cells.map(cellText))
          .filter((cells) => cells.some((cell) => cell !== ""));
      }

      function normalizeHeaderText(value) {
        return String(value)
          .toLowerCase()
          .replace(/[\s_\-/\\（）()·:：]/g, "");
      }

      function parseWeekday(value, fromDayColumn) {
        const raw = cellText(value);
        if (!raw) return null;
        if (fromDayColumn && /^[0-7]$/.test(raw)) {
          return Number(raw) === 0 ? 0 : Number(raw) - 1;
        }
        const chineseMap = { 一: 0, 二: 1, 三: 2, 四: 3, 五: 4, 六: 5, 日: 6, 天: 6 };
        const chineseMatch = raw.match(/(?:星期|周|礼拜)([一二三四五六日天])/);
        if (chineseMatch) return chineseMap[chineseMatch[1]];
        const englishMap = { mon: 0, tue: 1, wed: 2, thu: 3, fri: 4, sat: 5, sun: 6 };
        const englishMatch = raw.toLowerCase().match(/\b(mon|tue|wed|thu|fri|sat|sun)\b/);
        if (englishMatch) return englishMap[englishMatch[1]];
        const dateMatch = raw.match(/(\d{4})[年/.-](\d{1,2})[月/.-](\d{1,2})/);
        if (dateMatch) {
          const date = new Date(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3]));
          if (!Number.isNaN(date.getTime())) return (date.getDay() + 6) % 7;
        }
        return null;
      }

      function parseWeekdayFromText(value) {
        const text = cellText(value);
        if (!text) return null;
        const direct = parseWeekday(text, false);
        if (direct !== null) return direct;
        const match = text.match(/(\d{4})[年/.-](\d{1,2})[月/.-](\d{1,2})/);
        if (match) {
          const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
          if (!Number.isNaN(date.getTime())) return (date.getDay() + 6) % 7;
        }
        return null;
      }

      function parseSingleClock(value) {
        const text = cellText(value);
        const match = text.match(/(?<!\d)(\d{1,2})[:：](\d{2})(?!\d)/);
        if (!match) return null;
        const hour = Number(match[1]);
        const minute = Number(match[2]);
        if (hour > 23 || minute > 59) return null;
        return minutesToTime(hour * 60 + minute);
      }

      function parseTimeExpression(value) {
        const text = cellText(value);
        const matches = [...text.matchAll(/(?<!\d)(\d{1,2})[:：](\d{2})(?!\d)/g)];
        if (matches.length >= 2) {
          const firstMinutes = Number(matches[0][1]) * 60 + Number(matches[0][2]);
          const lastMatch = matches[matches.length - 1];
          const lastMinutes = Number(lastMatch[1]) * 60 + Number(lastMatch[2]);
          if (lastMinutes > firstMinutes) {
            return {
              start: minutesToTime(firstMinutes),
              end: minutesToTime(lastMinutes)
            };
          }
        }
        const only = parseSingleClock(text);
        if (only) return { start: only, end: null };
        return null;
      }

      const IMPORT_SLOT_STARTS = [480, 535, 600, 655, 840, 895, 960, 1015, 1140, 1195, 1260, 1320];

      function parseSlotInfo(value) {
        const compact = stripWeekNotes(value)
          .replace(/第/g, " ")
          .replace(/节/g, " ")
          .replace(/[，、]/g, ",");
        const pair = compact.match(/(?:\D|^)(\d{1,2})\s*[-—~至,]\s*(\d{1,2})(?:\D|$)/);
        let first = null;
        let last = null;
        if (pair) {
          first = Number(pair[1]);
          last = Number(pair[2]);
        } else {
          const single = compact.match(/(?:\D|^)(\d{1,2})(?:\D|$)/);
          if (single) {
            first = Number(single[1]);
            last = first;
          }
        }
        if (!first || first < 1 || first > IMPORT_SLOT_STARTS.length) return null;
        if (!last || last < first || last > IMPORT_SLOT_STARTS.length) return null;
        const startMinutes = IMPORT_SLOT_STARTS[first - 1];
        const endMinutes = Math.min(22 * 60, IMPORT_SLOT_STARTS[last - 1] + 45);
        return { start: minutesToTime(startMinutes), end: minutesToTime(endMinutes) };
      }

      function stripWeekNotes(value) {
        return cellText(value)
          .replace(/[（(][^（）()]*周[^（）()]*[）)]/g, " ")
          .replace(/[（(][单双]+[）)]/g, " ")
          .replace(/\d+\s*[-—~至]?\s*\d*\s*周/g, " ")
          .replace(/第\s*周/g, " ")
          .replace(/第(?=\s*$)/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function stripClockRanges(value) {
        return cellText(value)
          .replace(/\d{1,2}[:：]\d{2}\s*[-—~至]\s*\d{1,2}[:：]\d{2}/g, " ")

      function looksLikePlace(token) {
        return /(楼|室|馆|厅|机房|操场|实验室|线上|校区|教学楼)/.test(token) ||
          /^[A-Za-z]?[\d-]{2,}$/.test(token);

      function looksLikeTeacher(token) {
        return /(老师|教师)/.test(token);

      function metaHasSignal(meta) {
        return /[@]|老师|教师|(楼|室|馆|厅|机房|操场|实验室|线上)|^[A-Za-z]?[\d-]{2,}$|，|,/.test(meta);
      }

      function parseCourseNameAndMeta(value) {
        let text = stripWeekNotes(value);
        text = text.replace(/^\d+\s*[.、）)]\s*/, "");
        let name = text;
        let metaText = "";
        const atParts = text.split("@");
        if (atParts.length > 1) {
          name = atParts.shift().trim();
          metaText = atParts.join("@");
        } else {
          const metaMatch = text.match(/^(.+?)[（(]([^（）()]+)[）)](.*)$/);
          if (metaMatch && metaHasSignal(metaMatch[2])) {
            name = metaMatch[1].trim();
            metaText = `${metaMatch[2]} ${metaMatch[3] || ""}`.trim();
          }
        }
        if (!metaText && /\s+/.test(text)) {
          const parts = text.split(/\s+/).filter(Boolean);
          const trailingMeta = [];
          while (parts.length && (looksLikePlace(parts[parts.length - 1]) || looksLikeTeacher(parts[parts.length - 1]))) {
            trailingMeta.unshift(parts.pop());
          }
          if (trailingMeta.length && parts.length) {
            name = parts.join(" ");
            metaText = trailingMeta.join(" ");
          }
        }

        let place = "";
        let teacher = "";
        const tokens = metaText.split(/[@，,、\s]+/).filter(Boolean);
        for (const token of tokens) {
          if (!place && looksLikePlace(token)) place = token;
          else if (!teacher && token) teacher = token;
        }
        return { name: name || "", place, teacher };
      }

      function splitCellEntries(value) {
        return cellText(value)

      function matrixEntryGroups(value) {
        const lines = splitCellEntries(value);

          if (isMetaLine && groups.length) {

            groups.push(line);

        return groups;

        const mapping = { course: -1, day: -1, start: -1, end: -1, place: -1, teacher: -1 };
